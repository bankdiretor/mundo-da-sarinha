<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Vitrine — Personagem</title>
<style>html,body{margin:0;height:100%;background:#4a3a6a;overflow:hidden;}canvas{display:block;}
#hud{position:fixed;left:10px;bottom:10px;font:12px/1.5 system-ui,sans-serif;color:#e9def8;
opacity:.85;background:rgba(30,20,60,.55);padding:6px 10px;border-radius:8px}</style>
</head><body>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/utils/BufferGeometryUtils.js"></script>
<script src="partes/personagens/SarinhaCharacterBase.js"></script>
<script src="partes/personagens/SarinhaCharacterHead.js"></script>
<script src="partes/personagens/SarinhaHairShort01.js"></script>
<script src="partes/personagens/SarinhaHairLong01.js"></script>
<script src="partes/personagens/SarinhaHairWavy01.js"></script>
<script src="partes/personagens/SarinhaHairCurly01.js"></script>
<script src="partes/personagens/SarinhaHairBuns01.js"></script>
<script src="partes/personagens/SarinhaHairVolume01.js"></script>
<div id="hud"></div>
<script>
/* Vitrine do sistema de personagens (Sarinha Mini Style).
   Luz IDENTICA a _vitrine-teste.html — julgar cor fora da luz real ja custou
   uma poltrona reprovada.
   URL: ?vista=frente|34|lado|costas  &anchors=1  &silhueta=1  &pose=1
        &pele=D8A27E  &altura=2.6  &ref=1 (marcador de 1.40) */
var T = THREE;
T.BufferGeometryUtils = THREE.BufferGeometryUtils;
var q = new URLSearchParams(location.search);

var cena = new T.Scene();
cena.background = new T.Color(0x4a3a6a);
var cam = new T.PerspectiveCamera(35, innerWidth/innerHeight, 0.1, 50);
var rend = new T.WebGLRenderer({antialias:true});
rend.setSize(innerWidth, innerHeight);
document.body.appendChild(rend.domElement);

cena.add(new T.HemisphereLight(0xb9a5ee, 0x584a38, 0.9));
var sol = new T.DirectionalLight(0xffd9a0, 0.55);
sol.position.set(10, 18, 6);
cena.add(sol);

/* chao neutro para ler o contato do pe */
var chao = new T.Mesh(new T.CircleGeometry(6, 32).rotateX(-Math.PI/2),
                      new T.MeshLambertMaterial({color:0x6f5f96}));
chao.position.y = -0.002;
cena.add(chao);

/* ---- personagem ---- */
var altura = parseFloat(q.get('altura') || '2.6');
var pele = q.get('pele') ? parseInt(q.get('pele'), 16) : 0xD8A27E;
var S = window.SARINHA_PERSONAGENS;
/* ?cabeca=0 volta ao placeholder do CHAR-00; o padrao ja e a cabeca definitiva */
var comCabeca = q.get('cabeca') !== '0';
var boneco = S.createSarinhaCharacterBase(
  {T:T, BGU:T.BufferGeometryUtils},
  {height: altura, skinColor: pele, showDebugAnchors: q.get('anchors') === '1',
   showHeadPlaceholder: !comCabeca,
   headHeight: comCabeca ? S.HEAD_HEIGHT : undefined}
);
if (comCabeca){
  /* encaixa no HeadPivot que ja existe — nao mexe no rig nem nos anchors */
  boneco.userData.rig.headPivot.add(
    S.createSarinhaCharacterHead({T:T, BGU:T.BufferGeometryUtils},
      {skinColor: pele, showFace: q.get('rosto') !== '0',
       flatShading: q.get('flat') === '1'})   /* ?flat=1 volta ao facetado */
  );
  /* ?cabelo=0 tira · ?cabelo=HEX troca a cor (paleta da ficha em HAIR_PALETTE) */
  if (q.get('cabelo') !== '0' && q.get('cabelo') !== 'nenhum'){
    var corCabelo = /^[0-9a-f]{6}$/i.test(q.get('cabelo') || '')
                    ? parseInt(q.get('cabelo'), 16) : undefined;
    var qc = q.get('cabelo') || '';
    /* a vitrine usa o MESMO catalogo do Assembler: cabelo novo aparece sozinho */
    var MAPA = {longo:'createSarinhaHairLong01', ondulado:'createSarinhaHairWavy01',
                cacheado:'createSarinhaHairCurly01', coquinhos:'createSarinhaHairBuns01',
                volumoso:'createSarinhaHairVolume01', curto:'createSarinhaHairShort01'};
    var est = MAPA[qc] ? qc : (MAPA[q.get('estilo')] ? q.get('estilo') : 'curto');
    var criar = S[MAPA[est]] || S.createSarinhaHairShort01;
    var cabelo = criar({T:T, BGU:T.BufferGeometryUtils}, {hairColor: corCabelo});
    cabelo.position.y = cabelo.userData.offsetNoHairAnchor;
    boneco.userData.anchors.hair.add(cabelo);
  }
}
cena.add(boneco);

/* teste de silhueta: tudo numa cor escura solida (a forma tem de funcionar
   sem cor, sem rosto e sem roupa) */
if (q.get('silhueta') === '1'){
  var matSil = new T.MeshBasicMaterial({color:0x2a1b4e});
  boneco.traverse(function(o){ if (o.isMesh && o.name !== 'DebugMarker') o.material = matSil; });
  chao.material = new T.MeshBasicMaterial({color:0xcfc3ea});
}

/* prova de articulacao: dobra ombros, cotovelos, quadris e joelhos */
if (q.get('pose') === '1'){
  var rig = boneco.userData.rig;
  rig.leftShoulderPivot.rotation.x = -0.55;  rig.rightShoulderPivot.rotation.x = 0.55;
  rig.leftElbowPivot.rotation.x    = -0.70;  rig.rightElbowPivot.rotation.x    = -0.35;
  rig.leftHipPivot.rotation.x      =  0.45;  rig.rightHipPivot.rotation.x      = -0.45;
  rig.leftKneePivot.rotation.x     = -0.55;  rig.rightKneePivot.rotation.x     = -0.15;
  rig.headPivot.rotation.y         =  0.35;
}

/* referencia de escala: poste de 1.40 (a crianca do mundo) */
if (q.get('ref') !== '0'){
  var refG = new T.Group();
  var matRef = new T.MeshLambertMaterial({color:0xffd166});
  /* fica atras e ao lado: no eixo z=0 ele cruzava o boneco na vista lateral */
  var poste = new T.Mesh(new T.CylinderGeometry(0.02, 0.02, 1.40, 6), matRef);
  poste.position.set(1.5, 0.70, -1.3);
  var trav = new T.Mesh(new T.BoxGeometry(0.30, 0.02, 0.02), matRef);
  trav.position.set(1.5, 1.40, -1.3);
  refG.add(poste); refG.add(trav);
  cena.add(refG);
}

/* ---- vistas ----
   A distancia sai do ENQUADRAMENTO, nao de um numero fixo: numa janela estreita
   (celular, meia tela) o campo horizontal encolhe e o boneco era CORTADO — foi
   o que o Ivan viu. Calcula a distancia que satisfaz altura E largura. */
/* ?zoom=cabeca aproxima no rosto (o CHAR-01 se julga de perto) */
var zoomCabeca = q.get('zoom') === 'cabeca';
var alturaCabeca = S.HEAD_HEIGHT * (altura / 1.974);
var alvoY = zoomCabeca ? (altura - alturaCabeca * 0.55) : altura * 0.52;
function distanciaQueEnquadra(){
  var meiaFov = T.MathUtils.degToRad(cam.fov) / 2;
  var alvoAltura = zoomCabeca ? alturaCabeca * 1.5 : altura * 1.12;
  var alvoLargura = zoomCabeca ? alturaCabeca * 1.5 : altura * 0.46;
  var dv = (alvoAltura / 2) / Math.tan(meiaFov);
  var dh = (alvoLargura / 2) / (Math.tan(meiaFov) * cam.aspect);
  return Math.max(dv, dh);
}
var d = distanciaQueEnquadra();
var VISTAS = {
  frente: [0, alvoY, d],
  '34':   [d*0.62, alvoY*1.12, d*0.78],
  lado:   [d, alvoY, 0.001],
  costas: [0, alvoY, -d],
  topo:   [0.001, altura*1.9, 0.001]
};
var vista = q.get('vista') || 'frente';
var p = VISTAS[vista] || VISTAS.frente;
cam.position.set(p[0], p[1], p[2]);
cam.lookAt(0, alvoY, 0);
rend.render(cena, cam);

/* ---- orbita simples: arrastar gira, roda aproxima (sem lib externa) ---- */
var ang = Math.atan2(p[0], p[2]), altCam = p[1], raio = Math.hypot(p[0], p[2]), arrastando = false, ux = 0, uy = 0;
function recolocar(){
  cam.position.set(Math.sin(ang) * raio, altCam, Math.cos(ang) * raio);
  cam.lookAt(0, alvoY, 0);
  rend.render(cena, cam);
}
rend.domElement.addEventListener('pointerdown', function(e){ arrastando = true; ux = e.clientX; uy = e.clientY; });
addEventListener('pointerup', function(){ arrastando = false; });
addEventListener('pointermove', function(e){
  if (!arrastando) return;
  ang -= (e.clientX - ux) * 0.01;
  altCam = Math.max(0.1, Math.min(altura * 1.6, altCam + (e.clientY - uy) * 0.012));
  ux = e.clientX; uy = e.clientY;
  recolocar();
});
rend.domElement.addEventListener('wheel', function(e){
  e.preventDefault();
  raio = Math.max(1.6, Math.min(14, raio + e.deltaY * 0.004));
  recolocar();
}, {passive:false});
addEventListener('resize', function(){
  cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix();
  rend.setSize(innerWidth, innerHeight);
  raio = distanciaQueEnquadra();       /* reenquadra: janela estreita cortava o boneco */
  recolocar();
});

/* HUD com os numeros reais da cena */
var tri = 0, malhas = 0;
boneco.traverse(function(o){ if (o.isMesh && o.name !== 'DebugMarker'){
  malhas++; var g = o.geometry;
  tri += g.index ? g.index.count/3 : g.attributes.position.count/3;
}});
var bb = new T.Box3().setFromObject(boneco);
document.getElementById('hud').innerHTML =
  'CHAR-00 · ' + tri + ' tri · ' + malhas + ' malhas · altura ' +
  (bb.max.y - bb.min.y).toFixed(3) + ' · minY ' + bb.min.y.toFixed(4) +
  ' · dc ' + rend.info.render.calls +
  '<br><b>arraste para girar · roda para aproximar</b>';

window.__boneco = boneco; window.__cena = cena; window.__cam = cam; window.__rend = rend;
window.__pronto = true;
</script>
</body></html>
