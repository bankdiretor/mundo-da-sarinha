  document.getElementById('radio').classList.add('on');
  esconderPrompt();
}
function fecharRadio(){
  var el = document.getElementById('radio');
  if (el) el.classList.remove('on');
}
function tocarMusica(i){
  if (DANCA.ativa) return;                 /* nao atrapalha o minigame */
  pararMusica();
  RADIO.audio = new Audio(MUSICAS[i].src);
  RADIO.audio.loop = true;
  RADIO.audio.volume = 0.55;
  var pr = RADIO.audio.play();
  if (pr && pr.catch) pr.catch(function(){});
  RADIO.tocando = i;
  api('pulsar')();
  mostrarPrompt('Tocando: ' + MUSICAS[i].nome + ' \uD83C\uDFB5', 'a m\u00FAsica te acompanha pelo mundo');
  setTimeout(esconderPrompt, 3000);
}
function pararMusica(){
  if (RADIO.audio){ RADIO.audio.pause(); RADIO.audio = null; }
  RADIO.tocando = -1;
}

/* ===========================================================================
   PIANO DE PISAR (Parque Musical) — cada tecla toca uma nota da escala
   =========================================================================== */
var NOTAS_HZ = [262, 294, 330, 349, 392, 440, 494, 523, 587, 659, 698, 784, 880];
var pianoUltima = -1;
function tocarNota(i){
  try {
    if (!somCtx) somCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (somCtx.state === 'suspended') somCtx.resume();
    var t0 = somCtx.currentTime, o = somCtx.createOscillator(), g = somCtx.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(NOTAS_HZ[i % NOTAS_HZ.length], t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.16, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.5);
    o.connect(g); g.connect(somCtx.destination);
    o.start(t0); o.stop(t0 + 0.52);
  } catch(e){}
}
function tickPiano(){
  if (!PIANO || !PIANO.teclas) return;
  var achou = -1;
  for (var i = 0; i < PIANO.teclas.length; i++){
    var t = PIANO.teclas[i];
    if (Math.abs(PL.pos.x - t.x) < 0.75 && Math.abs(PL.pos.z - t.z) < 2.2){ achou = i; break; }
  }
  if (achou >= 0 && achou !== pianoUltima){
    pianoUltima = achou;
    if (typeof PIANO.pisarTecla === 'function') PIANO.pisarTecla(achou);
    tocarNota(achou);
  } else if (achou < 0) pianoUltima = -1;
}

/* ===========================================================================
   NUVEM DO ARCO-IRIS — plataforma flutuante a noroeste. A crianca sobe pelo
   arco-iris (que funciona como rampa) e desce escorregando por ele.
   =========================================================================== */
var NUVEM = { pronta:false, emCima:false, plat:null, arco:null, escorregando:0 };
function iniciarNuvem(){
  var p = PECA['parteNuvemArcoIris'];
  if (!p || !p.grupo) return;
  NUVEM.pronta = true;
  NUVEM.plat = p.grupo.userData.plataforma || {x:-34, z:-34, y:9.0, raio:6.5};
  NUVEM.arco = p.grupo.userData.arcoiris || {x0:-34, z0:-34, y0:9.0, x1:-20, z1:-20, y1:0};
}
function naPlataforma(x, z){
  if (!NUVEM.pronta) return false;
  return Math.hypot(x - NUVEM.plat.x, z - NUVEM.plat.z) < NUVEM.plat.raio - 0.4;
}
/* o pe do arco-iris, no chao: e ali que a crianca sobe */
function noPeDoArco(){
  if (!NUVEM.pronta || NUVEM.emCima) return false;
  return Math.hypot(PL.pos.x - NUVEM.arco.x1, PL.pos.z - NUVEM.arco.z1) < 2.4;
}
function subirNaNuvem(){
  if (!NUVEM.pronta || NUVEM.emCima) return;
  NUVEM.emCima = true;
  PL.pos.set(NUVEM.plat.x + 2.5, NUVEM.plat.y, NUVEM.plat.z + 2.5);
  visibilidadePorRegiao(true);
  esconderPrompt();
  mostrarPrompt('Voc\u00EA est\u00E1 na nuvem! \u2601\uFE0F', 'aperte de novo para escorregar pelo arco-\u00EDris');
  setTimeout(esconderPrompt, 3600);
}
function escorregarDaNuvem(){
  if (!NUVEM.emCima) return;
  NUVEM.emCima = false;
  NUVEM.escorregando = 1;
  tocarPlim();
}
function tickNuvem(dt){
  if (NUVEM.escorregando > 0){
    NUVEM.escorregando -= dt * 0.75;
    var k = Math.max(0, Math.min(1, 1 - NUVEM.escorregando));
    var a = NUVEM.arco;
    PL.pos.x = a.x0 + (a.x1 - a.x0) * k;
    PL.pos.z = a.z0 + (a.z1 - a.z0) * k;
    PL.pos.y = a.y0 + (a.y1 - a.y0) * k + Math.sin(k * Math.PI) * 1.2;
    if (NUVEM.escorregando <= 0){ NUVEM.escorregando = 0; visibilidadePorRegiao(true); }
  }
}

/* ===========================================================================
   O CORDEIRINHO — espera na praca; a crianca faz amizade, da um nome e ele
   passa a andar junto para sempre (inclusive dentro do quartinho).
   =========================================================================== */
var OVE = { g:null, pos:new T.Vector3(6.5, 0, 6.5), vel:0, dir:0, parado:0, casa:{x:6.5, z:6.5} };
function iniciarCordeiro(){
  var p = PECA['parteCordeiro'];
  if (!p || !p.grupo) return;
  OVE.g = p.grupo;
  OVE.g.position.copy(OVE.pos);
  var temDono = (ESTADO.cordeiro !== undefined && ESTADO.cordeiro !== null);
  api('mostrarCoracao')(!temDono);
  if (temDono){ OVE.pos.set(PL.pos.x + 1.4, 0, PL.pos.z + 1.4); OVE.g.position.copy(OVE.pos); }
}
function pertoDoCordeiro(){
  if (!OVE.g || ESTADO.cordeiro !== undefined && ESTADO.cordeiro !== null) return false;
  return Math.hypot(PL.pos.x - OVE.pos.x, PL.pos.z - OVE.pos.z) < 2.4;
}
function balir(){
  try {
    if (!somCtx) somCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (somCtx.state === 'suspended') somCtx.resume();
    var t0 = somCtx.currentTime;
    var o = somCtx.createOscillator(), g = somCtx.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(520, t0);
    o.frequency.exponentialRampToValueAtTime(300, t0 + 0.35);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.14, t0 + 0.04);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.4);
    o.connect(g); g.connect(somCtx.destination);
    o.start(t0); o.stop(t0 + 0.42);
  } catch(e){}
}
function adotarCordeiro(){
  if (!OVE.g) return;
  document.getElementById('nomes').classList.add('on');
  esconderPrompt();
}
function baterNome(i){
  ESTADO.cordeiro = i;
  salvarEstado();
  api('mostrarCoracao')(false);
  document.getElementById('nomes').classList.remove('on');
  balir();
  var nome = OVE.g.userData.NOMES[i];
  mostrarPrompt(nome + ' é seu amigo agora! 🐑', 'ele vai andar com você');
  setTimeout(esconderPrompt, 3200);
}
function tickCordeiro(t, dt){
  if (!OVE.g) return;
  var temDono = (ESTADO.cordeiro !== undefined && ESTADO.cordeiro !== null);
  var alvoX, alvoZ;
  if (temDono){
    /* fica a 1,5 m atras do jogador (na direcao contraria ao olhar) */
    alvoX = PL.pos.x + Math.sin(PL.yaw) * 1.5;
    alvoZ = PL.pos.z + Math.cos(PL.yaw) * 1.5;
  } else {
    alvoX = OVE.casa.x; alvoZ = OVE.casa.z;
  }
  var dx = alvoX - OVE.pos.x, dz = alvoZ - OVE.pos.z;
  var d = Math.hypot(dx, dz);
  var vAlvo = (d > 1.0) ? Math.min(M.vel * 1.05, d * 2.2) : 0;
  OVE.vel += (vAlvo - OVE.vel) * Math.min(1, dt * 4);
  if (d > 0.05 && OVE.vel > 0.02){
    OVE.pos.x += (dx/d) * OVE.vel * dt;
    OVE.pos.z += (dz/d) * OVE.vel * dt;
    OVE.dir = Math.atan2(dx, dz);
  }
  OVE.g.position.set(OVE.pos.x, PL.pos.y, OVE.pos.z);
  var alvoRot = OVE.dir + Math.PI;   /* o modelo olha para -Z */
  var difR = ((alvoRot - OVE.g.rotation.y + Math.PI*3) % (Math.PI*2)) - Math.PI;
  OVE.g.rotation.y += difR * Math.min(1, dt * 6);
  api('animar')(t, OVE.vel, OVE.dir);
  /* gracinha: se a crianca fica parada perto, ele pula de vez em quando */
  if (temDono && OVE.vel < 0.1){
    OVE.parado += dt;
    if (OVE.parado > 5){ OVE.parado = 0; api('pular')(); balir(); }
  } else OVE.parado = 0;
}

/* ===========================================================================
   O TRENZINHO — a crianca sobe e controla SO acelerar e parar; o trilho leva.
   Tambem e o transporte entre as regioes quando a cidade fica grande.
   =========================================================================== */
var TREM = { s:0, vel:0, aBordo:false, pronto:false, est:null };
function iniciarTrem(){
  var p = PECA['parteTrem'];
  if (!p || !p.grupo) return;
  TREM.pronto = true;
  TREM.est = p.grupo.userData.estacao;
  TREM.estacoes = p.grupo.userData.estacoes || [];
  TREM.s = TREM.est.s;
  api('porTrem')(TREM.s, 0, false);
}
/* anuncia a parada quando o trem chega perto de uma estacao — e o que
   transforma o passeio em TRANSPORTE: a crianca sabe onde esta e onde
   pode descer. So anuncia uma vez por chegada (guarda a ultima). */
function anunciarEstacao(){
  if (!TREM.aBordo || !TREM.estacoes || !TREM.estacoes.length) return;
  var pos = api('noTrilho')(TREM.s);
  if (!pos) return;
  var perto = null, melhor = 7.0;
  for (var i = 0; i < TREM.estacoes.length; i++){
    var e = TREM.estacoes[i];
    var d = Math.hypot(pos.x - e.x, pos.z - e.z);
    if (d < melhor){ melhor = d; perto = e; }
  }
  if (perto && perto !== TREM.ultimaEst){
    TREM.ultimaEst = perto;
    mostrarPrompt('Estacao ' + perto.nome + ' 🚉', 'freie com S para descer');
    clearTimeout(TREM.avisoTimer);
    TREM.avisoTimer = setTimeout(esconderPrompt, 2600);
  } else if (!perto && melhor >= 7.0){
    TREM.ultimaEst = null;      /* saiu da area: pode anunciar de novo na volta */
  }
}
function pertoDoTrem(){
  if (!TREM.pronto || TREM.aBordo) return false;
  var p = api('noTrilho')(TREM.s);
  return p && Math.hypot(PL.pos.x - p.x, PL.pos.z - p.z) < 3.2;
}
function subirNoTrem(){
  if (!TREM.pronto || TREM.aBordo) return;
  TREM.aBordo = true;
  TREM.vel = 0;
  esconderPrompt();
  mostrarPrompt('Segure para andar! 🚂', document.body.classList.contains('toque') ? 'joystick para frente' : 'W acelera · S freia');
  setTimeout(esconderPrompt, 3600);
}
function descerDoTrem(){
  if (!TREM.aBordo) return;
  if (TREM.vel > 1.2){          /* so desce devagar (seguranca de brinquedo) */
    mostrarPrompt('Freie primeiro! 🛑', 'segure S (ou puxe o joystick)');
    setTimeout(esconderPrompt, 2000);
    return;
  }
  TREM.aBordo = false;
  TREM.vel = 0;
  var p = api('noTrilho')(TREM.s);
  PL.pos.set(p.x + Math.cos(p.ang) * 2.2, 0, p.z - Math.sin(p.ang) * 2.2);
  limitarNoMundo(PL.pos);
}
function tickTrem(dt, aceleraFrente){
  if (!TREM.pronto) return;
  if (TREM.aBordo){
    var alvo = aceleraFrente > 0.2 ? 9.5 * aceleraFrente : (aceleraFrente < -0.2 ? 0 : TREM.vel * 0.985);
    TREM.vel += (alvo - TREM.vel) * Math.min(1, dt * (aceleraFrente < -0.2 ? 2.4 : 1.1));
    if (TREM.vel < 0.02) TREM.vel = 0;
    TREM.s += TREM.vel * dt;
    var a = api('assento')(TREM.s);
    PL.pos.set(a.x, 0.75, a.z);
    boneco.rotation.y = a.ang;
  }
  api('porTrem')(TREM.s, dt, TREM.vel > 0.3);
  if (TREM.aBordo) anunciarEstacao();
}

/* ===========================================================================
   KARTODROMO — a crianca PILOTA, nao anda de carona.
   O trenzinho corre preso ao trilho (1 grau de liberdade); o kart e livre em
   2D: tem direcao, inercia e volta de pista. Para nao virar frustracao aos 6
   anos, tres assistencias de jogo infantil:
     1. fora do asfalto o kart afunda na grama e perde velocidade (o castigo
        e perder a corrida, nunca capotar ou travar);
     2. um endireitamento SUAVE rumo a tangente da pista — ajuda a fazer a
        curva, mas nao dirige pela crianca;
     3. nao ha capotagem nem dano; a mureta de pneus so empurra de volta.
   ⛔ A direcao do kart NAO le o `ang` que a pista publica: a convencao de
   angulo dela e do boneco podem divergir. O rumo sai de diferenca finita de
   `centro(s)`, que e imune a isso.
   =========================================================================== */
var KART = { pronto:false, aBordo:false, malha:null, pista:null, veic:null,
             x:0, z:0, ang:0, vel:0, esterco:0, giroRoda:0,
             s:0, voltas:0, tVolta:0, melhor:0 };
var KART_VEL_PISTA = 12.5, KART_VEL_GRAMA = 4.2;
var _kvA = null;

/* rumo (rotation.y) para seguir a pista no ponto s — a frente do kart e -Z */
function rumoDaPista(s){
  var a = KART.pista.centro(s % 1), b = KART.pista.centro((s + 0.004) % 1);
  return Math.atan2(-(b.x - a.x), -(b.z - a.z));
}
function iniciarKart(){
  var p = PECA['parteKartodromo'];
  if (!p || !p.grupo || !p.grupo.userData || !p.grupo.userData.pista) return;
  if (!window.KART_VEICULO || typeof window.KART_VEICULO.kart !== 'function') return;
  var v = null;
  try { v = window.KART_VEICULO.kart(T, 0xe8536e); } catch(e){ console.error('kart falhou', e); return; }
  if (!v || !v.grupo) return;
  KART.pista = p.grupo.userData.pista;
  /* ⛔ a cerca do kart estava HARDCODED em (40,32) r 12/11 — as coordenadas
     ANTIGAS da zona. Quando o kartodromo mudou para (38,30) r 17/16, o kart
     passou a bater numa parede invisivel a cada quadro (`vel *= 0.5`) e
     andava 10,7 m em 15 s. Agora vem da propria peca. */
  KART.area = p.grupo.userData.area || { cx: 38, cz: 30, rx: 17, rz: 16 };
  KART.malha = v.grupo;
  KART.veic  = v.grupo.userData || {};
  p.grupo.add(KART.malha);          /* filho da zona: herda o culling */
  _kvA = new T.Vector3();
  porKartNaLargada();
  KART.pronto = true;
}
function porKartNaLargada(){
  var L = KART.pista.largada || { x:0, z:0, s:0 };
  KART.x = L.x; KART.z = L.z; KART.s = L.s || 0;
  KART.ang = rumoDaPista(KART.s);
  KART.vel = 0; KART.esterco = 0; KART.voltas = 0;
  aplicarKart();
}
function aplicarKart(){
  if (!KART.malha) return;
  KART.malha.position.set(KART.x, 0, KART.z);
  KART.malha.rotation.y = KART.ang;
}
function pertoDoKart(){
  if (!KART.pronto || KART.aBordo) return false;
  return Math.hypot(PL.pos.x - KART.x, PL.pos.z - KART.z) < 2.6;
}
function subirNoKart(){
  if (!KART.pronto || KART.aBordo) return;
  KART.aBordo = true;
  KART.vel = 0; KART.tVolta = 0;
  if (KART.malha) KART.malha.visible = true;
  esconderPrompt();
  mostrarPrompt('Acelera! 🏁', document.body.classList.contains('toque') ? 'joystick para dirigir' : 'W acelera · A/D viram · S freia');
  setTimeout(esconderPrompt, 3800);
}
function descerDoKart(){
  if (!KART.aBordo) return;
  if (Math.abs(KART.vel) > 1.4){
    mostrarPrompt('Freie primeiro! 🛑', 'segure S (ou puxe o joystick)');
    setTimeout(esconderPrompt, 2000);
    return;
  }
  KART.aBordo = false;
  KART.vel = 0;
  /* desce pelo lado esquerdo do kart, nunca dentro dele */
  PL.pos.set(KART.x + Math.cos(KART.ang) * 1.5, 0, KART.z - Math.sin(KART.ang) * 1.5);
  limitarNoMundo(PL.pos);
}
function tickKart(dt, acel, virar){
  if (!KART.pronto) return;
  if (!KART.aBordo){
    if (KART.veic.girarRodas) KART.veic.girarRodas(KART.giroRoda);
    return;
  }
  var proj = null;
  try { proj = KART.pista.projetar(KART.x, KART.z); } catch(e){ proj = null; }
  var naPista = !!(proj && Math.abs(proj.lateral) <= KART.pista.largura * 0.5);

  /* --- acelerar / frear (freio tambem e re, devagarinho) --- */
  var vmax = naPista ? KART_VEL_PISTA : KART_VEL_GRAMA;
  var alvo = acel > 0.2 ? vmax * Math.min(1, acel)
           : (acel < -0.2 ? -2.6 : KART.vel * 0.965);
  KART.vel += (alvo - KART.vel) * Math.min(1, dt * (acel < -0.2 ? 3.2 : 1.7));
  if (!naPista && KART.vel > KART_VEL_GRAMA) KART.vel += (KART_VEL_GRAMA - KART.vel) * Math.min(1, dt * 2.2);
  if (Math.abs(KART.vel) < 0.03) KART.vel = 0;

  /* --- direcao: o volante volta ao centro sozinho, e kart parado nao gira --- */
  var alvoEst = Math.max(-1, Math.min(1, virar)) * 0.55;
  KART.esterco += (alvoEst - KART.esterco) * Math.min(1, dt * 7);
  var agarra = Math.min(1, Math.abs(KART.vel) / 4.0);
  KART.ang -= KART.esterco * KART.vel * dt * 0.62 * (naPista ? 1 : 0.7);

  /* --- assistencia: puxa o rumo para a tangente da pista (nao dirige por ela) --- */
  if (naPista && proj && Math.abs(KART.vel) > 1.2){
    var d = ((rumoDaPista(proj.s) - KART.ang + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
    KART.ang += d * Math.min(1, dt * 0.9) * 0.30 * agarra;
  }

  /* --- anda --- */
  var nx = KART.x + (-Math.sin(KART.ang)) * KART.vel * dt;
  var nz = KART.z + (-Math.cos(KART.ang)) * KART.vel * dt;
  /* nao deixa sair da zona do kartodromo (empurra de volta, sem travar) */
  var A = KART.area;
  var ex = (nx - A.cx) / A.rx, ez = (nz - A.cz) / A.rz, de = Math.hypot(ex, ez);
  if (de > 1){
    nx = A.cx + (ex / de) * A.rx; nz = A.cz + (ez / de) * A.rz;
    KART.vel *= 0.75;
  }
  KART.x = nx; KART.z = nz;
  KART.giroRoda += KART.vel * dt * 2.6;

  /* --- volta completa: cruzou a largada indo para frente --- */
  KART.tVolta += dt;
  if (proj){
    var sAnt = KART.s;
    KART.s = proj.s;
    if (sAnt > 0.75 && KART.s < 0.25 && KART.tVolta > 6){
      KART.voltas++;
      if (!KART.melhor || KART.tVolta < KART.melhor) KART.melhor = KART.tVolta;
      mostrarPrompt('Volta ' + KART.voltas + '! 🏁 ' + KART.tVolta.toFixed(1) + 's',
                    KART.tVolta <= KART.melhor ? 'sua melhor volta!' : 'melhor: ' + KART.melhor.toFixed(1) + 's');
      setTimeout(esconderPrompt, 2600);
      KART.tVolta = 0;
    }
  }

  aplicarKart();
  if (KART.veic.girarRodas) KART.veic.girarRodas(KART.giroRoda);
  if (KART.veic.virarRodas) KART.veic.virarRodas(-KART.esterco);

  /* --- a crianca vai sentada: leva o boneco para o assento --- */
  var as = KART.veic.assento;
  if (as && _kvA){
    KART.malha.updateMatrixWorld(true);
    _kvA.set(as.x || 0, as.y || 0.45, as.z || 0.15);
    KART.malha.localToWorld(_kvA);
    PL.pos.set(_kvA.x, _kvA.y, _kvA.z);
  } else {
    PL.pos.set(KART.x, 0.5, KART.z);
  }
  boneco.rotation.y = KART.ang;
}

/* ===========================================================================
   RODA GIGANTE — o mirante do mundo. A crianca embarca na cabine de baixo,
   sobe, ve a cidade inteira pequenininha e desce ao completar a volta.
   =========================================================================== */
var RODA = { pronta:false, giro:0, vel:0.16, aBordo:false, cabine:-1, giroEmbarque:0, emb:null, topoVisto:false };
function iniciarRoda(){
  var p = PECA['parteParque'];
  if (!p || !p.grupo) return;
  RODA.pronta = true;
  RODA.emb = p.grupo.userData.embarque;
}
function pertoDaRoda(){
  if (!RODA.pronta || RODA.aBordo || !RODA.emb) return false;
  return Math.hypot(PL.pos.x - RODA.emb.x, PL.pos.z - RODA.emb.z) < 3.0;
}
function subirNaRoda(){
  if (!RODA.pronta || RODA.aBordo) return;
  RODA.cabine = api('cabineBaixa')(RODA.giro);
  RODA.giroEmbarque = RODA.giro;
  RODA.aBordo = true;
  RODA.topoVisto = false;   /* o momento do topo acontece uma vez por passeio */
  PL.yaw = Math.PI/2;      /* olhar para a CIDADE (oeste), nao para a estrutura */
  PL.pitch = -0.12;
  esconderPrompt();
  mostrarPrompt('Olhe a cidade lá de cima! 🎡', 'você desce sozinho na volta');
  setTimeout(esconderPrompt, 3400);
}
function descerDaRoda(){
  if (!RODA.aBordo) return;
  RODA.aBordo = false;
  PL.pos.set(RODA.emb.x, 0, RODA.emb.z - 1.6);
  RODA.cabine = -1;
}
var PECA_CABINES_SYNC = null, PECA_LUZES_GIRO_SYNC = null, PECA_BANCOS_SYNC = null;
function tickRoda(dt){
  if (!RODA.pronta) return;
  RODA.giro += RODA.vel * dt;
  api('girar')(RODA.giro);
  if (PECA_CABINES_SYNC) PECA_CABINES_SYNC(RODA.giro);
  if (PECA_LUZES_GIRO_SYNC) PECA_LUZES_GIRO_SYNC(RODA.giro);
  if (PECA_BANCOS_SYNC) PECA_BANCOS_SYNC(RODA.giro);
  if (RODA.aBordo){
    var p = api('posCabine')(RODA.cabine, RODA.giro);
    PL.pos.set(p.x, p.y - 1.35, p.z);
    /* momento especial: uma vez por passeio, ao passar perto do topo da roda
       (y > 90% do raio maximo) — sem geometria nova, so som + mensagem, custo
       zero de draw call (a Rodada 4 esta contendo o crescimento de proposito) */
    if (!RODA.topoVisto && p.y > 15.7){
      RODA.topoVisto = true;
      RODA.mostrandoTopo = true;
      tocarPlim();
      mostrarPrompt('Que vista linda daqui de cima! ✨', 'o mundo inteirinho...');
      setTimeout(function(){ RODA.mostrandoTopo = false; esconderPrompt(); }, 2600);
    }
    /* uma volta completa: desce sozinho no ponto de embarque */
    if (RODA.giro - RODA.giroEmbarque > Math.PI * 2 - 0.12) descerDaRoda();
  }
}

/* ---------- loop ---------- */
var relogio = new T.Clock();
var fpsN = 0, fpsT = 0, fpsVal = 0, camLivre = false;
function passo(){
  requestAnimationFrame(passo);
  var dt = Math.min(relogio.getDelta(), 0.05);
  var t = relogio.getElapsedTime();

  if (ceuMesh){ ceuMesh.position.copy(cam.position); estrelasCeu.position.copy(cam.position); }

  fpsN++; fpsT += dt;
  if (fpsT >= 1){ fpsVal = Math.round(fpsN/fpsT); fpsN = 0; fpsT = 0; }

  /* na montagem: bonequinho gira num close, sem controle */
  if (montagemAberta){
    /* balanco suave em vez de giro completo: a crianca precisa VER o rosto que escolheu */
    boneco.rotation.y = Math.sin(t * 0.85) * 0.55;
    boneco.userData.andar(t, false);
    rend.render(cena, cam);
    return;
  }

  /* movimento em 1 passo (mundo aberto, sem parede fina: empurroes radiais bastam) */
  var fx = 0, fz = 0;
  if (teclas.KeyW || teclas.ArrowUp)    fz -= 1;
  if (teclas.KeyS || teclas.ArrowDown)  fz += 1;
  if (teclas.KeyA || teclas.ArrowLeft)  fx -= 1;
  if (teclas.KeyD || teclas.ArrowRight) fx += 1;
  if (joyAtivo){ fx += joyVet.x; fz += joyVet.y; }
  var m = Math.hypot(fx, fz);
  if (m > 1){ fx /= m; fz /= m; }
  var andando = m > 0.05;
  tickRoda(dt);
  tickNuvem(dt);
  if (RODA.aBordo){
    boneco.position.copy(PL.pos);
    if (boneco.userData.andar) boneco.userData.andar(t, false);
    andando = false; m = 0;
  } else if (TREM.aBordo){
    tickTrem(dt, -fz);              /* fz negativo = W = acelerar */
    boneco.position.copy(PL.pos);
    if (boneco.userData.andar) boneco.userData.andar(t, false);
    andando = false; m = 0;
    tickKart(dt, 0, 0);
  } else if (KART.aBordo){
    tickKart(dt, -fz, fx);          /* W acelera · A/D esterçam */
    boneco.position.copy(PL.pos);
    if (boneco.userData.andar) boneco.userData.andar(t, false);
    andando = false; m = 0;
    tickTrem(dt, 0);
  } else {
    tickTrem(dt, 0);
    tickKart(dt, 0, 0);
  }
  if (andando && !TREM.aBordo && !KART.aBordo && !RODA.aBordo && NUVEM.escorregando <= 0){
    var c = Math.cos(PL.yaw), s = Math.sin(PL.yaw);
    PL.pos.x += (fx*c + fz*s) * M.vel * dt;
    PL.pos.z += (fz*c - fx*s) * M.vel * dt;
    limitarNoMundo(PL.pos);
    boneco.rotation.y = Math.atan2(fx*c + fz*s, fz*c - fx*s);
  }
  /* de pe no chao: so quando NAO esta embarcado (a roda levanta, o trem tem
     piso, o kart senta a crianca no banco). ⛔ PULO (pesquisa do Roblox):
     enquanto no ar, a fisica de queda manda — o "grudar no chao" de sempre
     so volta quando aterrissa, senao o pulo nunca sairia do lugar. */
  if (!RODA.aBordo && !TREM.aBordo && !KART.aBordo && NUVEM.escorregando <= 0){
    if (PL.noAr){
      PL.velY -= JUMP_GRAV * dt;
      PL.pos.y += PL.velY * dt;
      var chaoAgora = alturaChao(PL.pos.x, PL.pos.z);
      if (PL.pos.y <= chaoAgora){ PL.pos.y = chaoAgora; PL.velY = 0; PL.noAr = false; }
    } else {
      PL.pos.y += (alturaChao(PL.pos.x, PL.pos.z) - PL.pos.y) * Math.min(1, dt*12);
    }
  }
  boneco.position.copy(PL.pos);
  if (boneco.userData.andar) boneco.userData.andar(t, andando);
  /* rodopio de comemoracao a cada acerto da danca */
  if (rodopio.ativo){
    var kr = (t - rodopio.t0) / 0.3;
    if (kr >= 1){ rodopio.ativo = false; }
    else boneco.rotation.y += (Math.PI*2) * (dt / 0.3);
  }

  /* --- coleta de estrelinhas (distancia ao quadrado: barato) --- */
  for (var s=0; s<ESTRELAS.length; s++){
    if (!ESTADO.estrelas[s]){
      var ddx = PL.pos.x - ESTRELAS[s].x, ddz = PL.pos.z - ESTRELAS[s].z;
      if (ddx*ddx + ddz*ddz < 1.4*1.4) coletar(s);
    }
    porMatrizEstrela(s, t);
  }
  estrelasInst.instanceMatrix.needsUpdate = true;

  /* --- a guia flutua a frente, apontando a estrelinha mais proxima --- */
  (function guiar(){
    var alvoX = PL.pos.x, alvoZ = PL.pos.z - 2.4, alvoY = 2.1, achou = false, dMin = 1e9;
    for (var g=0; g<ESTRELAS.length; g++){
      if (ESTADO.estrelas[g]) continue;
      var gx = ESTRELAS[g].x - PL.pos.x, gz = ESTRELAS[g].z - PL.pos.z;
      var d2 = gx*gx + gz*gz;
      if (d2 < dMin){ dMin = d2; achou = true;
        var dd = Math.sqrt(d2) || 1;
        var passo2 = Math.min(2.6, dd * 0.55);
        alvoX = PL.pos.x + gx/dd * passo2;
        alvoZ = PL.pos.z + gz/dd * passo2;
      }
    }
    if (!achou && ESTADO.danca === false){       /* tudo coletado: chama para o coreto */
      var cx2 = CORETO.x - PL.pos.x, cz2 = CORETO.z - PL.pos.z;
      var dc = Math.hypot(cx2, cz2) || 1;
      alvoX = PL.pos.x + cx2/dc * Math.min(2.6, dc*0.5);
      alvoZ = PL.pos.z + cz2/dc * Math.min(2.6, dc*0.5);
    }
    alvoY = 2.1 + Math.sin(t*2) * 0.18 + PL.pos.y;
    guia.position.x += (alvoX - guia.position.x) * Math.min(1, dt*2.4);
    guia.position.z += (alvoZ - guia.position.z) * Math.min(1, dt*2.4);
    guia.position.y += (alvoY - guia.position.y) * Math.min(1, dt*3);
    guia.rotation.y = t * 1.1;
    guiaGlow.position.copy(guia.position);
    guiaGlow.scale.setScalar(2.0 + Math.sin(t*3) * 0.18);
  })();

  visibilidadePorRegiao(false);
  tickCordeiro(t, dt);

  /* --- prompts de proximidade: coreto (dancar), porta (entrar), casinha (morar) --- */
  if (!DANCA.ativa && !REV.ativa && !QUARTO.dentro && !RODA.mostrandoTopo){
    var toque = document.body.classList.contains('toque');
    CASA.perto = casaPerto();
    if (noBalcaoDaRadio()){
      if (!elPrompt.classList.contains('on'))
        mostrarPrompt('Escolher uma m\u00FAsica? \uD83C\uDFB5', toque ? 'toque na tela' : 'ESPA\u00C7O');
    } else if (noPeDoArco()){
      if (!elPrompt.classList.contains('on'))
        mostrarPrompt('Subir no arco-\u00EDris? \uD83C\uDF08', toque ? 'toque na tela' : 'ESPA\u00C7O');
    } else if (pertoDaRoda()){
      if (!elPrompt.classList.contains('on'))
        mostrarPrompt('Subir na roda gigante? 🎡', toque ? 'toque na tela' : 'ESPAÇO');
    } else if (pertoDoTrem()){
      if (!elPrompt.classList.contains('on'))
        mostrarPrompt('Andar de trenzinho? 🚂', toque ? 'toque na tela' : 'ESPAÇO');
    } else if (pertoDoKart()){
      if (!elPrompt.classList.contains('on'))
        mostrarPrompt('Pilotar o kart? 🏎️', toque ? 'toque na tela' : 'ESPAÇO');
    } else if (pertoDoCordeiro()){
      if (!elPrompt.classList.contains('on'))
        mostrarPrompt('Um cordeirinho! Fazer amizade? 🐑', toque ? 'toque na tela' : 'ESPAÇO');
    } else if (naPortaDaMinhaCasa()){
      if (!elPrompt.classList.contains('on'))
        mostrarPrompt('Entrar no seu quartinho? 🚪', toque ? 'toque na tela' : 'ESPAÇO');
    } else if (!ESTADO.festa && noPalcoDaFesta()){
      if (!elPrompt.classList.contains('on'))
        mostrarPrompt('Cantar "Viva, Viva Voc\u00EA"? \uD83C\uDF89', toque ? 'toque na tela' : 'ESPA\u00C7O');
    } else if (!ESTADO.danca && pertoDoCoreto()){
      if (!elPrompt.classList.contains('on'))
        mostrarPrompt('Dançar com a Sarinha? 💃', toque ? 'toque na tela' : 'ESPAÇO');
    } else if (CASA.perto >= 0 && CASA.perto !== ESTADO.casa){
      if (!elPrompt.classList.contains('on'))
        mostrarPrompt('Quer morar nesta casinha? 🏡', toque ? 'toque na tela' : 'ESPAÇO');
    } else if (elPrompt.classList.contains('on') && !pertoDoCoreto() && !noPalcoDaFesta()){
      esconderPrompt();
    }
  }
  tickDanca();
  tickPiano();
  if (!noBalcaoDaRadio()) fecharRadio();

  /* durante a Revelacao a camera e da cutscene */
  if (REV.ativa){
    tickRevelacao(t);
    for (var r=0; r<PARTES.length; r++) if (PARTES[r].update) PARTES[r].update(t, dt);
    rend.render(cena, cam);
    return;
  }

  /* camera 3a pessoa; colisores grandes tambem encurtam o recuo (sem paredes aqui) */
  if (camLivre){ rend.render(cena, cam); return; }
  /* no quarto a camera chega perto e NUNCA passa da parede (gotcha da sala fechada).
     ⛔ so o mundo aberto usa PL.zoom (scroll) — quarto/roda mantem distancia fixa
     de proposito (o quarto tem o gotcha da sala fechada; a roda ja calibra a
     vista do mirante). "alt" acompanha o zoom na MESMA razao que tinha com o
     5.4 fixo, senao a camera ficaria rasteira ao afastar ou vertical ao aproximar. */
  var dist = QUARTO.dentro ? 3.5 : (RODA.aBordo ? 8.5 : PL.zoom),
      alt = QUARTO.dentro ? 1.05 : (RODA.aBordo ? 1.6 : PL.zoom * (2.9/5.4));
  var alvo = new T.Vector3(PL.pos.x, PL.pos.y + 1.35, PL.pos.z);
  var dirX = Math.sin(PL.yaw), dirZ = Math.cos(PL.yaw);
  var dOk = dist;
  for (var q = 0; q < COLISORES.length && !RODA.aBordo; q++){
    var cq = COLISORES[q];
    if (cq.raio < 0.8) continue;                 /* postezinho nao corta camera */
    var ox = cq.x - alvo.x, oz = cq.z - alvo.z;
    var proj = ox*dirX + oz*dirZ;
    if (proj <= 0 || proj > dist + cq.raio) continue;
    var perp2 = ox*ox + oz*oz - proj*proj;
    if (perp2 < cq.raio*cq.raio){
      var corte = proj - Math.sqrt(cq.raio*cq.raio - perp2) - 0.25;
      if (corte < dOk) dOk = Math.max(1.6, corte);
    }
  }
  cam.position.set(alvo.x + dirX*dOk, alvo.y + alt*(dOk/dist) + PL.pitch*4, alvo.z + dirZ*dOk);
  if (QUARTO.dentro && QUARTO.lim){
    var mm = QUARTO.lim.meia + 0.35;
    cam.position.x = Math.max(QUARTO.lim.x - mm, Math.min(QUARTO.lim.x + mm, cam.position.x));
    cam.position.z = Math.max(QUARTO.lim.z - mm, Math.min(QUARTO.lim.z + mm, cam.position.z));
    cam.position.y = Math.min(QUARTO.lim.alt - 0.3, Math.max(0.6, cam.position.y));
  }
  cam.lookAt(alvo);

  for (var i=0; i<PARTES.length; i++) if (PARTES[i].update) PARTES[i].update(t, dt);
  /* ⛔ a logo GIRAVA 360 (t*0.28) e metade do tempo a crianca via o texto
     ESPELHADO — inclusive no primeiro quadro do jogo. Agora ela encara o
     jogador (so balanca de leve), entao le sempre certo. */
  if (logoMundo){
    var angLogo = Math.atan2(PL.pos.x - logoMundo.position.x, PL.pos.z - logoMundo.position.z);
    logoMundo.rotation.y = angLogo + Math.sin(t*0.6)*0.06;
    logoMundo.position.y = 2.9 + Math.sin(t*1.1)*0.09;
  }

  rend.render(cena, cam);
}

        b.classList.add('sel');

  (function trajes(){
    var S = window.SARINHA_PERSONAGENS;
    var fila = document.getElementById('fTraje');
    if (!fila || !S || !S.CATALOGO_ROUPA_LISTA) return;
    var lista = [{chave:'nenhum', nome:'Simples'}].concat(S.CATALOGO_ROUPA_LISTA());
    lista.forEach(function(item){
      var b = document.createElement('button');
      b.className = 'bolinha estiloBt' + ((ESTADO.avatar.traje || 'classico') === item.chave ? ' sel' : '');
      b.textContent = item.nome;
      b.addEventListener('click', function(){
        ESTADO.avatar.traje = item.chave;
        fila.querySelectorAll('.bolinha').forEach(function(x){ x.classList.remove('sel'); });
        b.classList.add('sel');
        trocarBoneco();
      });

    });
  })();

  filas.forEach(function(f){
    var fila = document.getElementById(f.id);
    f.cores.forEach(function(cor, i){
      var b = document.createElement('button');
      b.className = 'bolinha' + (ESTADO.avatar[f.chave] === i ? ' sel' : '');
      b.style.background = '#' + cor.toString(16).padStart(6, '0');
      b.addEventListener('click', function(){
        ESTADO.avatar[f.chave] = i;
        fila.querySelectorAll('.bolinha').forEach(function(x){ x.classList.remove('sel'); });
        b.classList.add('sel');
        trocarBoneco();
      });
      fila.appendChild(b);
    });
  });
  function abrir(){
    montagemAberta = true;
    el.classList.add('on');
    document.getElementById('splash').style.opacity = '0';
    boneco.position.copy(PL.pos);   /* o follow-cam ainda nao rodou: posiciona na mao */
    cam.position.set(PL.pos.x, 1.75, PL.pos.z - 3.9);
    cam.lookAt(new T.Vector3(PL.pos.x, 0.95, PL.pos.z));
  }
  function fechar(){
    montagemAberta = false;
    el.classList.remove('on');
    ESTADO.avatarPronto = true;
    salvarEstado();
    boneco.rotation.y = 0;
    var sp = document.getElementById('splash');
    sp.style.opacity = '1';
    setTimeout(function(){ sp.classList.add('off'); }, 2600);
  }
  document.getElementById('btEntrar').addEventListener('click', fechar);
  if (!ESTADO.avatarPronto) abrir();
  else document.getElementById('splash').classList.remove('off');
})();

/* ===========================================================================
   BLINDAGEM MOBILE/iOS — armadilhas ja pagas no XEQUE, aplicadas desde o dia 1.
   =========================================================================== */
(function blindarMobile(){
  /* 1) zoom fantasma: iOS ignora user-scalable=no desde o iOS 10 */
  var ultimoToque = 0;
  document.addEventListener('touchend', function(e){
    var agora = Date.now();
    if (agora - ultimoToque < 330) e.preventDefault();
    ultimoToque = agora;
  }, {passive:false, capture:true});
  document.addEventListener('gesturestart', function(e){ e.preventDefault(); }, {passive:false});

  /* 2) chavinha de silencioso do iPhone: um <audio> mudo em loop promove a sessao
        para "playback" e o som do jogo passa a tocar mesmo no silencioso */
  var mudo = document.createElement('audio');
  mudo.loop = true; mudo.setAttribute('playsinline', '');
  /* WAV silencioso de 0,05 s gerado em runtime (nada de arquivo externo) */
  var taxa = 8000, amostras = 400, buf = new ArrayBuffer(44 + amostras), dv = new DataView(buf);
  function txt(off, s){ for (var i=0;i<s.length;i++) dv.setUint8(off+i, s.charCodeAt(i)); }
  txt(0,'RIFF'); dv.setUint32(4, 36+amostras, true); txt(8,'WAVEfmt ');
  dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,1,true);
  dv.setUint32(24,taxa,true); dv.setUint32(28,taxa,true); dv.setUint16(32,1,true);
  dv.setUint16(34,8,true); txt(36,'data'); dv.setUint32(40, amostras, true);
  for (var i=0;i<amostras;i++) dv.setUint8(44+i, 128);
  mudo.src = URL.createObjectURL(new Blob([buf], {type:'audio/wav'}));

  /* 3) destravar audio no PRIMEIRO gesto — em fase de CAPTURA, senao um
        stopPropagation de qualquer botao mata o unlock (bug ja pago) */
  function destravar(){
    try { mudo.play().catch(function(){}); } catch(e){}
    try {
      if (!somCtx) somCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (somCtx.state === 'suspended') somCtx.resume();
    } catch(e){}
    if (DANCA.audio && DANCA.audio.paused && DANCA.ativa) DANCA.audio.play().catch(function(){});
  }
  ['touchstart','pointerdown','mousedown','keydown'].forEach(function(ev){
    document.addEventListener(ev, destravar, {capture:true, passive:true});
  });

  /* 4) aviso de retrato: o mundo e paisagem */
  var av = document.createElement('div');
  av.id = 'retrato';
  av.innerHTML = '<div>Vire o celular 🌟</div><div class="p">o mundo e maior deitado</div>';
  document.body.appendChild(av);
})();
