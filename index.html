<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#241664;
  font-family:"Baloo 2","Nunito",system-ui,sans-serif;color:#fff7ea;
  -webkit-user-select:none;user-select:none;touch-action:none}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}

/* abertura: o nome do mundo aparece e derrete */
#splash{position:absolute;left:50%;top:16%;transform:translateX(-50%);text-align:center;
  transition:opacity 1.2s;white-space:nowrap}
#splash h1{font-size:clamp(28px,6vw,52px);font-weight:800;letter-spacing:.02em;
  color:#fff7ea;text-shadow:0 3px 0 rgba(60,42,143,.55),0 0 34px rgba(255,209,102,.45)}
#splash .sub{font-size:clamp(12px,2.4vw,16px);color:#d9c9ff;font-family:"Nunito";letter-spacing:.14em}
#splash.off{opacity:0}

/* contador de estrelinhas (aparece na 1a coleta — T5) */
#estrelas{position:absolute;right:14px;top:12px;padding:7px 16px;border-radius:999px;
  background:rgba(36,22,100,.72);border:1px solid rgba(255,209,102,.5);
  font-size:18px;font-weight:700;display:none;backdrop-filter:blur(4px)}
#estrelas.pulso{animation:pulso .4s}
@keyframes pulso{50%{transform:scale(1.18)}}

/* dica de controles (so desktop) */
#dicas{position:absolute;left:14px;bottom:12px;padding:8px 14px;border-radius:12px;
  background:rgba(36,22,100,.6);font-family:"Nunito";font-size:12px;color:#d9c9ff}
body.toque #dicas{display:none}

/* prompt de interacao (T6 usa) */
#prompt{position:absolute;left:50%;top:58%;transform:translateX(-50%);text-align:center;
  opacity:0;transition:opacity .18s;pointer-events:none}
#prompt.on{opacity:1}
#prompt .txt{font-size:22px;font-weight:700;text-shadow:0 2px 0 rgba(60,42,143,.5)}
#prompt .bt{margin-top:8px;display:inline-block;padding:8px 26px;border-radius:999px;
  background:rgba(255,209,102,.92);color:#3c2a8f;font-size:15px;font-weight:800}

/* tela de montagem do bonequinho */
#montagem{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;
  align-items:center;justify-content:flex-end;padding-bottom:5vh;pointer-events:auto;
  background:linear-gradient(180deg,rgba(36,22,100,.42) 0%,rgba(36,22,100,0) 40%,rgba(36,22,100,.55) 100%)}
#montagem.on{display:flex}
#montagem h2{font-size:clamp(24px,5vw,40px);font-weight:800;position:absolute;top:7vh;
  left:50%;transform:translateX(-50%);white-space:nowrap;
  text-shadow:0 3px 0 rgba(60,42,143,.55)}
.fileira{display:flex;align-items:center;gap:10px;margin-top:10px}
.fileira .rot{width:86px;text-align:right;font-family:"Nunito";font-size:14px;color:#ffe9c9}
.bolinha{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.bolinha.sel{border-color:#fff7ea;box-shadow:0 0 0 3px rgba(255,209,102,.65)}
.estiloBt{width:auto!important;height:auto!important;border-radius:999px!important;padding:6px 13px!important;background:rgba(255,255,255,.14)!important;color:#f3ecff;font:600 12px/1 'Nunito',system-ui,sans-serif;white-space:nowrap}
.estiloBt.sel{background:#ffd166!important;color:#3b2470}
#btEntrar{margin-top:22px;padding:13px 46px;border:0;border-radius:999px;cursor:pointer;
  background:#ffd166;color:#3c2a8f;font-family:"Baloo 2";font-size:20px;font-weight:800;
  box-shadow:0 4px 0 rgba(60,42,143,.5)}
#btEntrar:active{transform:translateY(2px)}

/* painel de decoracao do quartinho */
#deco{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:none;
  gap:14px;align-items:center;padding:10px 16px;border-radius:18px;pointer-events:auto;
  background:rgba(36,22,100,.74);backdrop-filter:blur(6px);border:1px solid rgba(255,209,102,.35)}
#deco.on{display:flex}
#deco .gr{display:flex;align-items:center;gap:7px}
#deco .rot{font-family:"Nunito";font-size:12px;color:#ffe9c9}
#deco .bol{width:26px;height:26px;border-radius:50%;border:3px solid transparent;cursor:pointer}
#deco .bol.sel{border-color:#fff7ea}
#deco .sair{padding:7px 16px;border:0;border-radius:999px;background:#ffd166;color:#3c2a8f;
  font-family:"Baloo 2";font-weight:800;font-size:14px;cursor:pointer}
@media (max-width:640px){ #deco{gap:8px;padding:8px 10px} #deco .rot{display:none} #deco .bol{width:22px;height:22px} }

/* jukebox da Radio da Sarinha */
#radio{position:absolute;left:50%;bottom:74px;transform:translateX(-50%);display:none;
  flex-direction:column;gap:10px;align-items:center;padding:14px 20px;border-radius:20px;
  pointer-events:auto;background:rgba(36,22,100,.84);backdrop-filter:blur(6px);
  border:1px solid rgba(255,209,102,.45)}
#radio.on{display:flex}
#radio .tit{font-size:17px;font-weight:800}
#radio .ops{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:420px}
#radio .ops button{padding:9px 16px;border:0;border-radius:999px;cursor:pointer;
  background:#ffd166;color:#3c2a8f;font-family:"Baloo 2";font-weight:800;font-size:14px}
#radio .ops button.parar{background:#d9c9ff}

/* painel de nomes do cordeirinho */
#nomes{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:none;
  flex-direction:column;gap:14px;align-items:center;padding:22px 26px;border-radius:22px;
  pointer-events:auto;background:rgba(36,22,100,.86);backdrop-filter:blur(6px);
  border:1px solid rgba(255,209,102,.45)}
#nomes.on{display:flex}
#nomes .tit{font-size:22px;font-weight:800}
#nomes .ops{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;max-width:340px}
#nomes .ops button{padding:10px 18px;border:0;border-radius:999px;cursor:pointer;
  background:#ffd166;color:#3c2a8f;font-family:"Baloo 2";font-weight:800;font-size:16px}

/* aviso de retrato (so no celular em pe) */
#retrato{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;gap:8px;
  align-items:center;justify-content:center;background:#26114f;text-align:center;
  font-size:26px;font-weight:800}
#retrato .p{font-family:"Nunito";font-size:15px;color:#d9c9ff;font-weight:600}
@media (max-width:900px) and (orientation:portrait){ body.toque #retrato{display:flex} }

/* joystick fofo */
#joy{position:absolute;left:24px;bottom:24px;width:136px;height:136px;border-radius:50%;
  border:2px solid rgba(255,247,234,.35);background:rgba(60,42,143,.28);
  pointer-events:auto;display:none;touch-action:none}
#joy .knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;
  border-radius:50%;background:rgba(255,247,234,.85);
  box-shadow:0 3px 10px rgba(36,22,100,.45)}
body.toque #joy{display:block}
</style>

<script>
/* ===========================================================================
   MUNDO DA SARINHA — v1 (Praca da Estrelinha + Jardim)
   Derivado do motor da Camara do Nexo (arena-3d): mesmo esquema de movimento,
   joystick, camera 3a pessoa e contrato de partes — sala fechada virou praca
   ao ar livre sob o ceu roxo da marca. Regioes vestem via window.MUNDO_PARTES.
   =========================================================================== */
(function(){
'use strict';
var T = THREE;

/* ---------- config unica ---------- */
var M = {
  raioPraca: 22,
  raioJogador: 0.45,
  /* ⛔ ERA 5.2 — mais rapido que o Roblox (deixei assim de proposito na 1a
     rodada). Pesquisa: WalkSpeed padrao do Roblox e 16 studs/s, e 1 stud =
     0.28m (oficial, desde 2019) -> 16*0.28 = 4.48 m/s. O Ivan pediu a MESMA
     experiencia, entao o numero bate exato agora (nossa unidade ~1 metro,
     coerente com o boneco de 1.90m de altura). */
  vel: 4.48,
  /* cores do CEU = tokens exatos do site (styles.css do repo bankdiretor/sarinha,
     oklch convertido): night e grape. O mundo e a continuacao do site, nao um primo. */
  corCeuTopo: 0x26114f,   /* --night */
  corCeuBase: 0x6a3fc5,   /* --grape */
  corNevoa: 0x3c2a8f,
  corChao: 0xf4edde,       /* creme */
  corGrama: 0xbcd6b0,      /* verde-pastel */
  paleta: { creme:0xf4edde, rosa:0xe8a7b2, azulpo:0x9fb4d8, mel:0xe9b44c, roxo:0x6a3fc5 }
};

/* ---------- cena ---------- */
var cena = new T.Scene();
cena.background = new T.Color(M.corCeuTopo);
/* ⛔ A NEVOA ERA 24→90 e foi calibrada para o mundo pequeno (a crianca andava
   ate 53). Com o mundo maior, TUDO alem de 90 virava roxo puro: visto do alto,
   o gramado sumia e a ilha inteira aparecia da cor do ceu — justo o defeito
   que o Ivan mandou consertar ("o verde e predominante"). A nevoa tem de
   comecar depois da zona vizinha e so fechar depois da borda do gramado (88). */
cena.fog = new T.Fog(M.corNevoa, 42, 168);

/* ⛔ ERA 62°. Pesquisa: o Roblox usa 70° de FOV padrao na camera Classic —
   enxerga mais dos lados, importante com o mundo grande de hoje. */
var cam = new T.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 360);
var rend = new T.WebGLRenderer({antialias:!/Mobi|Android/i.test(navigator.userAgent)});
rend.setPixelRatio(Math.min(devicePixelRatio, 2));
rend.setSize(innerWidth, innerHeight);
/* NAO definir outputEncoding: as cores pastel foram escolhidas contra o padrao linear
   (mesma regra paga na arena — ligar sRGB lava o cenario inteiro). */
document.body.appendChild(rend.domElement);

/* Luz de noite magica: hemisferica roxa-clara sobre chao creme + direcional dourada.
   SO estas duas — brilho extra e sempre emissivo/MeshBasic (regra de orcamento). */
cena.add(new T.HemisphereLight(0xb9a5ee, 0x584a38, 0.9));
var sol = new T.DirectionalLight(0xffd9a0, 0.55);
sol.position.set(10, 18, 6);
cena.add(sol);

addEventListener('resize', function(){
  cam.aspect = innerWidth/innerHeight; cam.updateProjectionMatrix();
  rend.setSize(innerWidth, innerHeight);
});

/* ---------- materiais de feltro ---------- */
function materialFeltro(cor){ return new T.MeshLambertMaterial({color:cor}); }
function materialBrilho(cor){ return new T.MeshBasicMaterial({color:cor}); }

/* ---------- ceu: cupula gradiente + estrelas ---------- */
/* a cupula acompanha a camera (nao fica presa na origem): a Casa da Sarinha
   mora a ~370 unidades do centro do mundo, bem fora do raio 150 da cupula —
   sem isso, de la se veria uma "bola roxa solida" em vez de ceu (achado real,
   testado com screenshot, nao suposto) */
var ceuMesh = null, estrelasCeu = null;
(function ceu(){
  var geo = new T.SphereGeometry(150, 24, 14);
  var pos = geo.attributes.position, n = pos.count, cores = new Float32Array(n*3);
  var topo = new T.Color(M.corCeuTopo), base = new T.Color(0x8a5fd0);
  for (var i=0; i<n; i++){
    var y = pos.getY(i) / 150;                    /* -1..1 */
    var f = Math.max(0, Math.min(1, (y + 0.25) / 1.1));
    var c = base.clone().lerp(topo, f);
    cores[i*3] = c.r; cores[i*3+1] = c.g; cores[i*3+2] = c.b;
  }
  geo.setAttribute('color', new T.BufferAttribute(cores, 3));
  var ceuM = new T.Mesh(geo, new T.MeshBasicMaterial({vertexColors:true, side:T.BackSide, fog:false}));
  cena.add(ceuM);
  ceuMesh = ceuM;

  /* estrelas: 1 Points, so acima do horizonte */
  var NE = 260, arr = new Float32Array(NE*3);
  for (var k=0; k<NE; k++){
    var az = Math.random()*Math.PI*2, el = 0.12 + Math.random()*1.35;
    var r = 142;
    arr[k*3]   = Math.cos(az)*Math.cos(el)*r;
    arr[k*3+1] = Math.sin(el)*r;
    arr[k*3+2] = Math.sin(az)*Math.cos(el)*r;
  }
  var g2 = new T.BufferGeometry();
  g2.setAttribute('position', new T.BufferAttribute(arr, 3));
  var est = new T.Points(g2, new T.PointsMaterial({color:0xfff2c9, size:1.6, sizeAttenuation:false, fog:false}));
  cena.add(est);
  estrelasCeu = est;
})();

/* ---------- chao: disco creme da praca + anel de grama pastel (1 DC) ---------- */
(function chao(){
  var BGU = T.BufferGeometryUtils;
  function tinge(geo, cor){
    var c = new T.Color(cor), n = geo.attributes.position.count, a = new Float32Array(n*3);
    for (var i=0; i<n; i++){ a[i*3]=c.r; a[i*3+1]=c.g; a[i*3+2]=c.b; }
    geo.setAttribute('color', new T.BufferAttribute(a, 3));
    return geo;
  }
  var praca = tinge(new T.CircleGeometry(M.raioPraca + 1.5, 48).rotateX(-Math.PI/2), M.corChao);
  /* grama derrete na nevoa: borda externa pintada da cor do ceu-base (sem faixa cinza) */
  /* ⛔ O CHAO ERA ROXO, nao verde (17/08). O anel de grama derretia na cor
     do ceu (0x7a55c8) desde o raio 23,5 — com expoente 1.4 o roxo ja
     dominava na metade do mundo, e o gramado sumia. No mapa-mestre o verde
     e PREDOMINANTE e cada zona assenta o piso dela por cima.
     Agora: verde cheio ate 74, e o derretimento acontece so nos ultimos
     14 (74→88), onde a nevoa realmente entra. Verde tambem ficou mais vivo
     (0xa9d18e no lugar do 0xbcd6b0 acinzentado).
     ⛔ O MUNDO CRESCEU (18/08): as zonas viviam espremidas — o parque nao
     comportava o carrossel novo e o trilho passava por dentro dele. Estes
     tres numeros (raio do anel de grama, rDerrete e r1) andam JUNTOS com o
     RAIO_ILHA da caminhada e com o LIMITE_ILHA do trem.js. */
  var grama = new T.RingGeometry(M.raioPraca + 1.5, 88, 60, 8).rotateX(-Math.PI/2);
  (function(){
    var cIn = new T.Color(0xa9d18e), cOut = new T.Color(0x7a55c8);
    var pos = grama.attributes.position, n = pos.count, a = new Float32Array(n*3);
    var rDerrete = 74, r1 = 88;
    for (var i=0; i<n; i++){
      var rr = Math.hypot(pos.getX(i), pos.getZ(i));
      var f = Math.pow(Math.max(0, Math.min(1, (rr - rDerrete) / (r1 - rDerrete))), 1.5);
      var c = cIn.clone().lerp(cOut, f);
      a[i*3]=c.r; a[i*3+1]=c.g; a[i*3+2]=c.b;
    }
    grama.setAttribute('color', new T.BufferAttribute(a, 3));
  })();
  grama.translate(0, -0.02, 0);
  var m = new T.Mesh(BGU.mergeBufferGeometries([praca, grama]),
    new T.MeshLambertMaterial({vertexColors:true}));
  cena.add(m);
})();

/* ---------- colisores e limites ---------- */
var COLISORES = [];        /* {x,z,raio} — as partes registram os seus */

/* O mundo v1 = tres areas coladas: circulo da PRACA + CORREDOR + elipse do JARDIM.
   O jogador pode estar em qualquer uma; so e empurrado quando esta fora das TRES. */
var JD = { cx:0, cz:-38, rx:13, rz:10 };          /* elipse do Jardim (26x20), ao NORTE */
var VL = { cx:0, cz: 40, rx:15.5, rz:12.4 };          /* elipse da Vilinha (26x20), ao SUL */
var COR = { meiaLarg:3.0, z0:-30, z1:-19 };        /* corredor praca <-> jardim */
var COS = { meiaLarg:3.0, z0: 19, z1: 32 };        /* corredor praca <-> vilinha */

function dentroPraca(x, z, folga){
  return Math.hypot(x, z) <= (M.raioPraca - folga);
}
function dentroElipse(e, x, z, folga){
  var ex = (x - e.cx) / (e.rx - folga), ez = (z - e.cz) / (e.rz - folga);
  return (ex*ex + ez*ez) <= 1;
}
function dentroJardim(x, z, folga){ return dentroElipse(JD, x, z, folga); }
function dentroVilinha(x, z, folga){ return dentroElipse(VL, x, z, folga); }
function dentroParque(x, z, folga){ return dentroElipse(PQ, x, z, folga); }
function dentroFesta(x, z, folga){ return dentroElipse(FE, x, z, folga); }
/* corredor LESTE: da praca ate a estacao do trenzinho (o trilho passa por fora) */
var COE = { meiaLarg:3.0, x0:19, x1:32 };
var PQ = { cx:42, cz:0, rx:12, rz:11 };    /* Parque (roda gigante), a leste */
var FE = { cx:-42, cz:0, rx:12, rz:11 };  /* Festinha, a oeste */
var COW = { meiaLarg:3.0, x0:-32, x1:-19 };
function dentroCorredor(x, z, folga){
  return (Math.abs(x) <= (COR.meiaLarg - folga) && z >= COR.z0 && z <= COR.z1) ||
         (Math.abs(x) <= (COS.meiaLarg - folga) && z >= COS.z0 && z <= COS.z1) ||
         (Math.abs(z) <= (COE.meiaLarg - folga) && x >= COE.x0 && x <= COE.x1) ||
         (Math.abs(z) <= (COW.meiaLarg - folga) && x >= COW.x0 && x <= COW.x1);
}
function limitarNoMundo(p){
  var f = M.raioJogador;
  if (NUVEM.emCima && NUVEM.plat){
    var dn = Math.hypot(p.x - NUVEM.plat.x, p.z - NUVEM.plat.z);
    var lim = NUVEM.plat.raio - f;
    if (dn > lim){ var fn = lim / dn;
      p.x = NUVEM.plat.x + (p.x - NUVEM.plat.x) * fn;
      p.z = NUVEM.plat.z + (p.z - NUVEM.plat.z) * fn; }
    return;
  }
  /* dentro do quartinho o mundo e a caixa: nada de colisor de rua aqui */
  if (QUARTO.dentro && QUARTO.lim){
    var m = QUARTO.lim.meia;
    p.x = Math.max(QUARTO.lim.x - m, Math.min(QUARTO.lim.x + m, p.x));
    p.z = Math.max(QUARTO.lim.z - m, Math.min(QUARTO.lim.z + m, p.z));
    return;
  }
  /* ===========================================================================
     MUNDO LIVRE (17/08, pedido do Ivan) — "o boneco pode andar em tudo e para
     todo lugar".
     ANTES: a crianca so podia pisar numa LISTA de areas (praca, jardim,
     vilinha, parque, festa e 4 corredores). Fora disso ela era puxada de
     volta. O castelo nunca entrou nessa lista, entao era literalmente
     INALCANCAVEL — e a praca parecia cercada, com saida so pelos portais.
     Somando os ~300 colisores de decoracao, o mundo virou um labirinto.
     AGORA: a unica fronteira e a BORDA DA ILHA. O gramado inteiro e andavel;
     zonas, caminhos e portais viraram convite visual, nao parede.
     (RAIO_ILHA 78: o gramado e verde cheio ate 74 e derrete ate 88; a
     crianca para antes da saia, e o anel do trem — que corre em 72 — fica
     DENTRO do mundo andavel, entao da para chegar a pe em qualquer estacao.) */
  var RAIO_ILHA = 78;
  var dIlha = Math.hypot(p.x, p.z);
  var limIlha = RAIO_ILHA - f;
  if (dIlha > limIlha){
    var kIlha = limIlha / dIlha;
    p.x *= kIlha; p.z *= kIlha;
  }
  /* COLISORES desligados: eram ~300 paredes invisiveis de decoracao (arvore,
     vaso, poste, cerca) que faziam a crianca travar sem entender por que.
     O array continua sendo preenchido pelas pecas — quem quiser religar so
     precisa voltar este laco. */
  if (COLISORES_LIGADOS){
    for (var i=0; i<COLISORES.length; i++){
      var c = COLISORES[i];
      var dx = p.x - c.x, dz = p.z - c.z, dd = Math.hypot(dx, dz), rr = c.raio + M.raioJogador;
      if (dd < rr){
        if (dd < 1e-4){ dx = 1; dz = 0; dd = 1; }
        p.x = c.x + dx/dd*rr; p.z = c.z + dz/dd*rr;
      }
    }
  }
}
var COLISORES_LIGADOS = false;   /* mundo livre */
/* degrau do coreto do Jardim (plataforma raio 3.0 elevada 0.35, em (0,-44)) */
var CORETO = { x:0, z:-44, raio:3.0, alt:0.35 };
function alturaChao(x, z){
  if (NUVEM.emCima && NUVEM.plat) return NUVEM.plat.y;
  if (PONTE && Math.abs(x - PONTE.x) < 6.2 && Math.abs(z - PONTE.z) < 1.6) return PONTE.alt;
  if (PONTE && Math.abs(z - PONTE.z) < 6.2 && Math.abs(x - PONTE.x) < 1.6) return PONTE.alt;
  if (PALCO_F){
    var dp = Math.hypot(x - PALCO_F.x, z - PALCO_F.z);
    if (dp < PALCO_F.raio - 0.2) return PALCO_F.alt;
    if (dp < PALCO_F.raio + 0.5) return PALCO_F.alt * 0.5;
  }
  var d = Math.hypot(x - CORETO.x, z - CORETO.z);
  if (d < CORETO.raio - 0.25) return CORETO.alt;
  if (d < CORETO.raio + 0.35) return CORETO.alt * 0.5;   /* degrau intermediario */
  /* CASTELO: plataforma elevada + rampa da escadaria. A peca publica a
     pegada em userData.plataforma; aqui so convertemos o ponto para o
     eixo LOCAL dela (o castelo esta girado -45 no mapa). */
  if (CASTELO_PLAT){
    var P = CASTELO_PLAT;
    var rx = x - P.x, rz = z - P.z;
    var co = Math.cos(-P.rot), si = Math.sin(-P.rot);
    var lx = rx * co - rz * si, lz = rx * si + rz * co;   /* coords locais */
    /* 1) RAMPA primeiro: se testar depois, a pegada da plataforma engole
          a rampa e a crianca sobe 1.32 de uma vez (defeito medido) */
    if (Math.abs(lx) < P.escadaLarg && lz >= P.escadaZ1 && lz <= P.escadaZ0){
      var t = (P.escadaZ0 - lz) / (P.escadaZ0 - P.escadaZ1);
      return P.alt * Math.max(0, Math.min(1, t));
    }
    /* 2) nivel de cima  3) terraco da volta */
    if (Math.abs(lx) < P.meiaL && Math.abs(lz) < P.meiaP) return P.alt;
    if (Math.abs(lx) < P.terracoL && Math.abs(lz) < P.terracoP) return P.terracoAlt;
  }
  return 0;
}
var CASTELO_PLAT = null;   /* preenchido depois que as partes montam */

/* ---------- montagem das partes (mesmo contrato da arena) ---------- */
var ctx = { T:T, cena:cena, M:M, materialFeltro:materialFeltro,
            materialBrilho:materialBrilho, COLISORES:COLISORES };
var PARTES = [], API = {}, PECA = {}, logoMundo = null;
/* ⛔ PECAS-COMPONENTE: existem para OUTRA peca compor, e NAO devem ser
   montadas sozinhas. Sem esta lista, montarPartes() plantava cada uma na
   ORIGEM — havia um castelo inteiro desmontado (fundacao+torre+nucleo+
   asas+escada) e as 4 casas empilhados NO MEIO DA PRACA, porque registrei
   os scripts delas para castelo-mundo.js / casas-vilinha.js usarem.
   Quem as usa: parteCasteloMundo (34,-34) e parteCasasVilinha (vilinha). */
var COMPONENTES = {
  parteTorreCastelo:1, parteFundacaoCastelo:1, parteNucleoCastelo:1,
  parteAsasCastelo:1, parteEscadaCastelo:1,
  parteCasa01:1, parteCasa02:1, parteCasa03:1, parteCasa04:1
};
function montarPartes(){
  var reg = window.MUNDO_PARTES || {};
  var nomes = Object.keys(reg), dcTotal = 0;
  for (var i=0; i<nomes.length; i++){
    var k = nomes[i];
    if (COMPONENTES[k]) continue;      /* so entra no mundo pela peca que a compoe */
    try {
      var r = reg[k](ctx);
      if (!r || !r.grupo) continue;
      cena.add(r.grupo);
      PARTES.push(r);
      PECA[k] = r;
      dcTotal += (r.custo && r.custo.dc) || 0;
      for (var f in r){
        if (typeof r[f] === 'function' && f !== 'update') API[f] = r[f];
      }
      /* as pecas expoem funcoes no userData do grupo (contrato) — promover tambem,
         senao api('marcarCasa'), api('corParede') etc. chamam no vazio e a tela
         nao muda (bug real: a decoracao salvava no estado e nao pintava nada) */
      var ud = r.grupo.userData || {};
      for (var g in ud){
        if (typeof ud[g] === 'function' && API[g] === undefined) API[g] = ud[g];
      }
    } catch(e){ console.warn('[MUNDO] parte falhou:', k, e); }
  }
  console.log('[MUNDO] partes ativas:', PARTES.length, '| dc declarado:', dcTotal);

  /* a plataforma do castelo entra no alturaChao (subir a escada / andar em cima) */
  if (PECA.parteCasteloMundo && PECA.parteCasteloMundo.grupo.userData.plataforma){
    CASTELO_PLAT = PECA.parteCasteloMundo.grupo.userData.plataforma;
  }

  /* --- ponte: os artesaos expoem funcoes no userData do grupo; o jogo chama por nome --- */
  function daParte(nome, campo){
    var p = PECA[nome];
    if (!p || !p.grupo || !p.grupo.userData) return null;
    var fn = p.grupo.userData[campo];
    return (typeof fn === 'function') ? fn : null;
  }
  API.acenderLampiao  = daParte('parteLampioes', 'acender') || function(){};
  API.desabrocharFlor = daParte('parteFlores', 'desabrochar') || function(){};
  API.pulsarAnel      = daParte('parteCoreto', 'pulsar') || function(){};
  /* o "acender" do centro e do jardim reaproveita o que a peca oferecer;
     se a peca nao expuser nada, a estrelinha ainda conta (nunca quebra o jogo) */
  API.acenderCentro = daParte('parteCentro', 'acender') || function(){};

  /* --- a LOGO 3D pousa no slot do monumento (mesmo GLB da pagina da logo) --- */
  (function porLogo(){
    var p = PECA['parteCentro'];
    var slot = p && p.grupo && (p.grupo.userData.slotLogo ||
               (typeof p.pegarSlotLogo === 'function' ? p.pegarSlotLogo() : null));
    if (!slot || !T.GLTFLoader) return;
    var ld = new T.GLTFLoader();
    if (typeof MeshoptDecoder !== 'undefined' && ld.setMeshoptDecoder) ld.setMeshoptDecoder(MeshoptDecoder);
    ld.load('logo-jogo.glb', function(g){
      var o = g.scene;
      o.scale.setScalar(1.75);              /* GLB nasce com 2 m: vira ~3,5 m de monumento */
      o.traverse(function(x){ if (x.isMesh) x.frustumCulled = false; });
      slot.add(o);
      logoMundo = slot;
    }, undefined, function(){ console.warn('[MUNDO] logo-lite.glb nao carregou (a haste fica sem ela)'); });
  })();
  API.acenderJardim = daParte('parteCoreto', 'acender')
                   || daParte('parteFlores', 'acender') || function(){};
  /* winding invertido deixa peca oca: DoubleSide e barato e resolve (regra da arena) */
  cena.traverse(function(o){
    if (!o.isMesh && !o.isInstancedMesh) return;
    var mm = o.material; if (!mm) return;
    (Array.isArray(mm) ? mm : [mm]).forEach(function(x){ if (x) x.side = T.DoubleSide; });
  });
}
function api(nome){ return typeof API[nome] === 'function' ? API[nome] : function(){}; }

/* ---------- jogador ---------- */
/* ⛔ zoom (PL.zoom) e pulo (velY/noAr) sao novos, pesquisa do Roblox: la o
   jogador pode aproximar/afastar a camera com o scroll (0.5 a 400 studs no
   original — aqui um intervalo bem menor, o mundo e pequeno pra crianca).
   ZOOM_DEF = 5.4 e o valor fixo que a camera ja usava; ZOOM_MIN/MAX dao uma
   folga de +-2 pra cada lado sem descaracterizar a visao de sempre. */
var ZOOM_DEF = 5.4, ZOOM_MIN = 3.4, ZOOM_MAX = 8.4;

/* ---------- bonequinho de feltro (montavel) ---------- */
var PELES   = [0xf7d6bd, 0xeab68f, 0xb97a4e, 0x8a5a3a];
var CABELOS = [0x4a3020, 0x2b2b33, 0xd9a441, 0xa8542c, 0x6a4a8f, 0xe8a7b2];
var ROUPAS  = [0xe8a7b2, 0x9fb4d8, 0xbcd6b0, 0xe9b44c, 0xd9c9ff, 0xf4edde];

function montarBoneco(cfg){
  var BGU = T.BufferGeometryUtils;
  var grupo = new T.Group();
  var pele = new T.Color(PELES[cfg.pele]), cab = new T.Color(CABELOS[cfg.cabelo]),
      rou = new T.Color(ROUPAS[cfg.roupa]);
  function pinta(geo, c){
    var n = geo.attributes.position.count, a = new Float32Array(n*3);
    for (var i=0; i<n; i++){ a[i*3]=c.r; a[i*3+1]=c.g; a[i*3+2]=c.b; }
    geo.setAttribute('color', new T.BufferAttribute(a, 3));
    return geo;
  }
  var matV = new T.MeshLambertMaterial({vertexColors:true});

  /* tronco fixo: corpo + cabeca + cabelo + rosto — tudo mesclado, cor por vertice (1 DC).
     Proporcao chibi (cabeca grande) e o pe no CHAO: a primeira versao flutuava 13 cm. */
  var olho = new T.Color(0x2a1d1d), boch = new T.Color(0xf19aa4);
  var pecas = [];
  pecas.push(pinta(new T.CapsuleGeometry(0.29, 0.30, 4, 12).translate(0, 0.94, 0), rou));
  pecas.push(pinta(new T.SphereGeometry(0.30, 16, 12).translate(0, 1.60, 0), pele));
  pecas.push(pinta(new T.SphereGeometry(0.315, 15, 10, 0, Math.PI*2, 0, Math.PI*0.55)
    .translate(0, 1.605, 0.012), cab));                                 /* calota do cabelo */
  pecas.push(pinta(new T.SphereGeometry(0.185, 10, 8).scale(1, 0.7, 0.6)
    .translate(0, 1.46, 0.20), cab));                                   /* volume da nuca */
  pecas.push(pinta(new T.CapsuleGeometry(0.06, 0.20, 3, 8).rotateZ(0.42)
    .translate(-0.27, 1.52, 0.03), cab));                               /* mechinha esq */
  pecas.push(pinta(new T.CapsuleGeometry(0.06, 0.20, 3, 8).rotateZ(-0.42)
    .translate(0.27, 1.52, 0.03), cab));                                /* mechinha dir */
  pecas.push(pinta(new T.SphereGeometry(0.038, 8, 6).translate(-0.105, 1.62, -0.262), olho));
  pecas.push(pinta(new T.SphereGeometry(0.038, 8, 6).translate(0.105, 1.62, -0.262), olho));
  pecas.push(pinta(new T.SphereGeometry(0.05, 8, 6).scale(1, 0.62, 0.5)
    .translate(-0.175, 1.53, -0.245), boch));
  pecas.push(pinta(new T.SphereGeometry(0.05, 8, 6).scale(1, 0.62, 0.5)
    .translate(0.175, 1.53, -0.245), boch));
  var tronco = new T.Mesh(BGU.mergeBufferGeometries(pecas), matV);
  grupo.add(tronco);

  /* membros com pivo no ombro/quadril (pendulo da caminhada); pe/mao mesclados no membro */
  function membro(corMembro, corPonta, raio, comp, px, py, rPonta){
    var g = new T.Group();
    var partes = [
      pinta(new T.CapsuleGeometry(raio, comp, 3, 8).translate(0, -comp/2 - raio, 0), corMembro),
      pinta(new T.SphereGeometry(rPonta, 9, 7).scale(1, 0.78, 1.2)
        .translate(0, -comp - raio*2 + rPonta*0.2, -rPonta*0.28), corPonta)
    ];
    var mm = new T.Mesh(BGU.mergeBufferGeometries(partes), matV);
    g.add(mm); g.position.set(px, py, 0);
    grupo.add(g);
    return g;
  }
  var sapato = new T.Color(0x6a5acd).lerp(rou, 0.35);
  var bracoE = membro(pele, pele,   0.075, 0.26, -0.33, 1.26, 0.095);
  var bracoD = membro(pele, pele,   0.075, 0.26,  0.33, 1.26, 0.095);
  var pernaE = membro(rou,  sapato, 0.10,  0.30, -0.17, 0.62, 0.125);
  var pernaD = membro(rou,  sapato, 0.10,  0.30,  0.17, 0.62, 0.125);

  var sombra = new T.Mesh(new T.CircleGeometry(0.42, 16),
    new T.MeshBasicMaterial({color:0x2a1b6e, transparent:true, opacity:.28, depthWrite:false}));
  sombra.rotation.x = -Math.PI/2; sombra.position.y = 0.02;
  sombra.renderOrder = 2; grupo.add(sombra);

  grupo.userData.andar = function(t, andando){
    var amp = andando ? 0.62 : 0;
    var w = Math.sin(t * 9);
    bracoE.rotation.x =  w * amp;  bracoD.rotation.x = -w * amp;
    pernaE.rotation.x = -w * amp;  pernaD.rotation.x =  w * amp;
    tronco.position.y = andando ? Math.abs(Math.sin(t*9)) * 0.05 : Math.sin(t*1.8) * 0.015;
    grupo.rotation.x = andando ? 0.06 : 0;
  };
  return grupo;
}

/* ⭐ O personagem agora vem do SISTEMA (CHAR-00/01/02/03/04 + Assembler).
   `montarBoneco` acima continua no arquivo como reserva: se o sistema nao
   carregar, o jogo cai nele em vez de ficar sem personagem. */
function criarPersonagem(){
  var S = window.SARINHA_PERSONAGENS;
  if (!S || !S.montarPersonagem) return montarBoneco(ESTADO.avatar);
  return S.montarPersonagem({T:T, BGU:T.BufferGeometryUtils}, {
    altura: 1.90,
    pele: ESTADO.avatar.pele,
    cabelo: ESTADO.avatar.estilo || 'curto',
    corCabelo: ESTADO.avatar.cabelo,
    corRoupa: ROUPAS[ESTADO.avatar.roupa],
    traje: ESTADO.avatar.traje === 'nenhum' ? null : (ESTADO.avatar.traje || 'classico'),
    /* ⛔ MEDIDO com a matriz real do three.js (5 angulos de yaw, todos
       consistentes): o default do Assembler (olharPara:-1) gira o rosto
       EXATAMENTE para o lado oposto do movimento deste jogo — dot=-1.00 em
       todos os testes. A logica de rotacao daqui (boneco.rotation.y =
       atan2(moveX,moveZ), ver o loop principal) ja alinha o local+Z — que e
       a frente NATIVA documentada em SarinhaCharacterHead.js — com a
       direcao do movimento sem nenhum giro extra. O comentario do
       Assembler ("a convencao do jogo e -Z") nao bate com este jogo
       especifico; olharPara:1 desliga o giro extra e resolve. */
    olharPara: 1
  });
}
var boneco = criarPersonagem();
cena.add(boneco);
function trocarBoneco(){
  var rotY = boneco.rotation.y, pos = boneco.position.clone();

}
/* a acao principal do jogo: dancar na batida, comecar a danca, interagir — e,
   se nada disso se aplica, PULAR (mesmo botao do Roblox: Espaco interage
   perto de algo, ou pula se nao ha nada por perto). */
function acaoPrincipal(){
  if (REV.ativa){ sairRevelacao(); return; }
  if (QUARTO.dentro){ sairQuarto(); return; }
  if (DANCA.ativa){ baterAgora(); return; }
  if (pertoDoCoreto()){ iniciarDanca('jardim'); return; }
  if (noPalcoDaFesta()){ iniciarDanca('festa'); return; }
  if (NUVEM.escorregando > 0){ return; }      /* escorregando: so aproveita */
  if (NUVEM.emCima){ escorregarDaNuvem(); return; }
  if (noPeDoArco()){ subirNaNuvem(); return; }
  if (noBalcaoDaRadio()){ abrirRadio(); return; }
  if (RODA.aBordo){ return; }                 /* na roda, so espera a volta */
  if (pertoDaRoda()){ subirNaRoda(); return; }
  if (TREM.aBordo){ descerDoTrem(); return; }
  if (pertoDoTrem()){ subirNoTrem(); return; }
  if (KART.aBordo){ descerDoKart(); return; }
  if (pertoDoKart()){ subirNoKart(); return; }
  if (pertoDoCordeiro()){ adotarCordeiro(); return; }
  if (naPortaDaMinhaCasa()){ entrarQuarto(); return; }
  if (CASA.perto >= 0 && CASA.perto !== ESTADO.casa){ escolherCasa(CASA.perto); return; }
  pular();
}
function pertoDoCoreto(){
  return Math.hypot(PL.pos.x - CORETO.x, PL.pos.z - CORETO.z) < CORETO.raio + 1.2;
}
var PALCO_F = null, PONTE = null, PIANO = null;
function iniciarFesta(){
  var p = PECA['parteFesta'];
  if (p && p.grupo) PALCO_F = p.grupo.userData.palco;
}
function noPalcoDaFesta(){
  if (!PALCO_F) return false;
  return Math.hypot(PL.pos.x - PALCO_F.x, PL.pos.z - PALCO_F.z) < PALCO_F.raio + 1.4;
}

/* ===========================================================================
   ESTRELINHA-GUIA E COLETA DE LUZ
   12 estrelinhas escondidas; cada uma acende algo do mundo. A guia (a mesma
   estrelinha do clipe = o cuidado de Deus) voa a frente e leva a crianca.
   =========================================================================== */
var ESTRELAS = [
  /* praca: 7 — acendem os 6 lampioes e o canteiro do monumento */
  { x:  9.5, z:  6.0, alvo:{tipo:'lampiao', i:0} },
  { x: -8.0, z:  9.0, alvo:{tipo:'lampiao', i:1} },
  { x:-13.0, z: -3.0, alvo:{tipo:'lampiao', i:2} },
  { x: -5.0, z:-13.5, alvo:{tipo:'lampiao', i:3} },
  { x: 12.5, z: -6.5, alvo:{tipo:'lampiao', i:4} },
  { x:  4.0, z: 15.5, alvo:{tipo:'lampiao', i:5} },
  { x:  0.0, z:  4.2, alvo:{tipo:'centro'} },
  /* jardim: 5 — acendem o coreto e as bandeirinhas */
  { x: -7.5, z:-33.0, alvo:{tipo:'jardim', i:0} },
  { x:  8.0, z:-35.0, alvo:{tipo:'jardim', i:1} },
  { x: -9.0, z:-43.0, alvo:{tipo:'jardim', i:2} },
  { x:  9.5, z:-45.0, alvo:{tipo:'jardim', i:3} },
  { x:  0.0, z:-31.0, alvo:{tipo:'jardim', i:4} }
];
var TOTAL_ESTRELAS = ESTRELAS.length;

/* estrela de 5 pontas em geometria propria (extrusao barata) */
function geoEstrela(rExt, rInt, espessura){
  var forma = new T.Shape();
  for (var i=0; i<10; i++){
    var r = (i % 2 === 0) ? rExt : rInt;
    var a = -Math.PI/2 + i * Math.PI/5;
    var x = Math.cos(a)*r, y = Math.sin(a)*r;
    if (i === 0) forma.moveTo(x, y); else forma.lineTo(x, y);
  }
  forma.closePath();
  var g = new T.ExtrudeGeometry(forma, {depth:espessura, bevelEnabled:false});
  g.center();
  g.deleteAttribute('uv');
  return g;
}

var estrelasMesh = [], guia = null, guiaGlow = null;
var somCtx = null;
function tocarPlim(){
  try {
    if (!somCtx) somCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (somCtx.state === 'suspended') somCtx.resume();
    var t0 = somCtx.currentTime;
    [880, 1320].forEach(function(f, k){
      var o = somCtx.createOscillator(), g = somCtx.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(f, t0 + k*0.06);
      g.gain.setValueAtTime(0.0001, t0 + k*0.06);
      g.gain.exponentialRampToValueAtTime(0.18, t0 + k*0.06 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + k*0.06 + 0.22);
      o.connect(g); g.connect(somCtx.destination);
      o.start(t0 + k*0.06); o.stop(t0 + k*0.06 + 0.24);
    });
  } catch(e){}
}

/* as 12 estrelinhas num UNICO InstancedMesh: 12 draw calls viraram 1 */
var estrelasInst = null, mtxTmp = new T.Matrix4(), qTmp = new T.Quaternion(),
    vTmp = new T.Vector3(), eTmp = new T.Euler(), escZero = new T.Vector3(0,0,0),
    escUm = new T.Vector3(1,1,1);
function porMatrizEstrela(i, t){
  if (ESTADO.estrelas[i]){
    mtxTmp.compose(vTmp.set(0,-999,0), qTmp.identity(), escZero);
  } else {
    eTmp.set(0, t * 1.6 + i, 0);
    qTmp.setFromEuler(eTmp);
    vTmp.set(ESTRELAS[i].x, 1.15 + Math.sin(t*2 + i) * 0.12, ESTRELAS[i].z);
    mtxTmp.compose(vTmp, qTmp, escUm);
  }
  estrelasInst.setMatrixAt(i, mtxTmp);
}
(function criarEstrelas(){
  var geo = geoEstrela(0.30, 0.13, 0.09);
  var mat = new T.MeshBasicMaterial({color:0xffd166});
  estrelasInst = new T.InstancedMesh(geo, mat, ESTRELAS.length);
  estrelasInst.instanceMatrix.setUsage(T.DynamicDrawUsage);
  for (var i=0; i<ESTRELAS.length; i++) porMatrizEstrela(i, 0);
  estrelasInst.instanceMatrix.needsUpdate = true;
  cena.add(estrelasInst);
  /* a guia: estrela um pouco maior com halo */
  guia = new T.Mesh(geoEstrela(0.38, 0.17, 0.11), new T.MeshBasicMaterial({color:0xfff0b8}));
  guia.position.set(PL.pos.x, 2.2, PL.pos.z - 2.5);
  cena.add(guia);
  var cv = document.createElement('canvas'); cv.width = cv.height = 64;
  var cx = cv.getContext('2d');
  var gr = cx.createRadialGradient(32, 32, 2, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,225,140,.95)');
  gr.addColorStop(0.45, 'rgba(255,209,102,.35)');
  gr.addColorStop(1, 'rgba(255,209,102,0)');
  cx.fillStyle = gr; cx.fillRect(0, 0, 64, 64);
  var tex = new T.CanvasTexture(cv); tex.generateMipmaps = false; tex.minFilter = T.LinearFilter;
  guiaGlow = new T.Sprite(new T.SpriteMaterial({map:tex, transparent:true, depthWrite:false}));
  guiaGlow.scale.setScalar(2.2);
  cena.add(guiaGlow);
})();

/* ===========================================================================
   MINIGAME DO RITMO — dancar "Deus Cuida de Mim" no coreto do Jardim.
   As batidas sao as REAIS da musica (513 tempos medidos do audio, nao no olho).
   Sem punicao: errar nao faz nada, a flor so espera a proxima batida.
   =========================================================================== */
var DANCA = {
  ativa: false, janela: 0.18, alvo: 16, acertos: 0,
  audio: null, idx: 0, ultimoPulso: -1, fim: 58, local: 'jardim'
};
/* cada lugar tem sua musica, suas batidas medidas e seu efeito de acerto */
var PALCOS = {
  jardim: { src:'b01.mp3', alvo:16, fim:58,
            batidas:function(){ return typeof BATIDAS_B01 !== 'undefined' ? BATIDAS_B01 : []; },
            aoAcertar:function(n){ api('desabrocharFlor')(n); },
            aoPulsar:function(){ api('pulsarAnel')(1); },
            aoFim:'O jardim floresceu! \uD83C\uDF38' },
  festa:  { src:'viva.mp3', alvo:16, fim:62,
            batidas:function(){ return typeof BATIDAS_VIVA !== 'undefined' ? BATIDAS_VIVA : []; },
            aoAcertar:function(n){ api('soltarBalao')(n, relogio.getElapsedTime()); },
            aoPulsar:function(){ api('pulsarPalco')(); },
            aoFim:'Que festa linda! \uD83C\uDF88' }
};
function cfg(){ return PALCOS[DANCA.local] || PALCOS.jardim; }
function baseDeBatidas(){ return cfg().batidas(); }
function iniciarDanca(local){
  if (DANCA.ativa) return;
  DANCA.local = local || 'jardim';
  var c = cfg();
  if (DANCA.local === 'jardim' && ESTADO.danca) return;
  if (DANCA.local === 'festa' && ESTADO.festa) return;
  DANCA.alvo = c.alvo; DANCA.fim = c.fim;
  var batidas = baseDeBatidas();
  if (!batidas.length){ console.warn('[MUNDO] sem batidas: batidas-b01.js nao carregou'); return; }
  DANCA.ativa = true; DANCA.acertos = 0; DANCA.idx = 0; DANCA.ultimoPulso = -1;
  esconderPrompt();
  if (!DANCA.audio || DANCA.audioSrc !== c.src){
    DANCA.audio = new Audio(c.src);
    DANCA.audioSrc = c.src;
    DANCA.audio.preload = 'auto';
  }
  DANCA.audio.currentTime = 0;
  var p = DANCA.audio.play();
  if (p && p.catch) p.catch(function(){ console.warn('[MUNDO] audio bloqueado pelo navegador'); });
  mostrarPrompt('Dance no ritmo! 💃', 'toque ou ESPACO na batida');
  setTimeout(esconderPrompt, 3000);
}
function baterAgora(){
  if (!DANCA.ativa || !DANCA.audio) return;
  var t = DANCA.audio.currentTime, batidas = baseDeBatidas();
  var melhor = 9, iMelhor = -1;
  for (var i = Math.max(0, DANCA.idx - 3); i < Math.min(batidas.length, DANCA.idx + 4); i++){
    var d = Math.abs(batidas[i] - t);
    if (d < melhor){ melhor = d; iMelhor = i; }
  }
  if (melhor <= DANCA.janela && iMelhor !== DANCA.ultimoPulso){
    DANCA.ultimoPulso = iMelhor;
    if (DANCA.acertos < DANCA.alvo){
      cfg().aoAcertar(DANCA.acertos);
      DANCA.acertos++;
      rodopiar();
      tocarPlim();
    }
    if (DANCA.acertos >= DANCA.alvo) terminarDanca();
  }
}
var rodopio = { ativo:false, t0:0 };
function rodopiar(){ rodopio.ativo = true; rodopio.t0 = relogio.getElapsedTime(); }
function terminarDanca(){
  if (!DANCA.ativa) return;
  DANCA.ativa = false;
  /* buque final: o que faltou abre junto (ninguem sai de maos vazias) */
  for (var i = DANCA.acertos; i < DANCA.alvo; i++) cfg().aoAcertar(i);
  if (DANCA.local === 'festa') ESTADO.festa = true; else ESTADO.danca = true;
  salvarEstado();
  /* fade da musica em 2s */
  var a = DANCA.audio;
  if (a){
    var v0 = a.volume, t0 = performance.now();
    var it = setInterval(function(){
      var k = (performance.now() - t0) / 2000;
      if (k >= 1){ a.pause(); a.volume = v0; clearInterval(it); return; }
      a.volume = v0 * (1 - k);
    }, 60);
  }
  mostrarPrompt(cfg().aoFim, 'que lindo!');
  setTimeout(esconderPrompt, 3200);
  checarRevelacao();
}
function tickDanca(){
  if (!DANCA.ativa || !DANCA.audio) return;
  var t = DANCA.audio.currentTime, batidas = baseDeBatidas();
  while (DANCA.idx < batidas.length && batidas[DANCA.idx] < t - 0.05) DANCA.idx++;
  /* o anel do coreto pulsa NA batida (o marcador visual do ritmo) */
  for (var i = Math.max(0, DANCA.idx - 1); i < Math.min(batidas.length, DANCA.idx + 1); i++){
    if (Math.abs(batidas[i] - t) < 0.05 && i !== DANCA.marcado){
      DANCA.marcado = i;
      cfg().aoPulsar();
    }
  }
  if (t >= DANCA.fim) terminarDanca();
}

/* ===========================================================================
   A REVELACAO — 12 estrelinhas + a danca: o mundo aparece nas duas maos gentis.
   =========================================================================== */
var REV = { ativa:false, t0:0, maos:null, cartela:null, dur:14 };
function checarRevelacao(){
  if (ESTADO.revelacao || REV.ativa) return;
  if (contarEstrelas() >= TOTAL_ESTRELAS && ESTADO.danca) revelacao();
}
function construirMaos(){
  var BGU = T.BufferGeometryUtils, pecas = [];
  function pinta(geo, cor){
    var c = new T.Color(cor), n = geo.attributes.position.count, a = new Float32Array(n*3);
    for (var i=0;i<n;i++){ a[i*3]=c.r; a[i*3+1]=c.g; a[i*3+2]=c.b; }
    geo.setAttribute('color', new T.BufferAttribute(a,3));
    geo.deleteAttribute('uv');
    return geo;
  }
  var creme = 0xf0d3bd, sombra = new T.Color(0xf0d3bd).lerp(new T.Color(0x6a5a8f), 0.20).getHex();
  /* Duas maos gentis ABRACANDO a cidade pelos lados (a v1 colocava as palmas
     abaixo do chao — ficavam enterradas e o plano-tesouro nao aparecia).
     O mundo ocupa x±22 e z de 0 a -48; o centro visual e (0, -22). */
  var CX = 0, CZ = -22;
  [-1, 1].forEach(function(lado){
    var cor = lado < 0 ? creme : sombra;
    /* palma: prato alongado rente ao chao, na lateral do mundo */
    var palma = new T.SphereGeometry(1, 16, 11);
    palma.scale(9, 2.6, 25);
    palma.translate(CX + lado * 33, 0.6, CZ);
    pecas.push(pinta(palma, cor));
    /* dedos finos EMOLDURANDO a borda (nao cobrindo o mundo): a ponta para
       na beirada e as maos leem como concha em volta da cidade */
    for (var d=0; d<4; d++){
      var dedo = new T.CapsuleGeometry(1.9, 11, 4, 8);
      dedo.rotateZ(lado * Math.PI/2 * 0.86);
      dedo.translate(CX + lado * (27.5 - d*0.5), 2.4 + d*0.2, CZ - 15 + d*10);
      pecas.push(pinta(dedo, cor));
    }
    /* polegar: cruza um pouco mais para dentro, na frente */
    var pol = new T.CapsuleGeometry(2.1, 9, 4, 8);
    pol.rotateZ(lado * Math.PI/2 * 0.72);
    pol.rotateY(lado * 0.5);
    pol.translate(CX + lado * 26, 2.2, CZ + 19);
    pecas.push(pinta(pol, cor));
    var punho = new T.SphereGeometry(1, 12, 9);
    punho.scale(7, 3.4, 8);
    punho.translate(CX + lado * 40, 1.0, CZ + 22);
    pecas.push(pinta(punho, cor));
  });
  return new T.Mesh(BGU.mergeBufferGeometries(pecas),
    new T.MeshLambertMaterial({vertexColors:true, transparent:true, opacity:0}));
}
function construirCartela(){
  var cv = document.createElement('canvas'); cv.width = 1024; cv.height = 300;
  var cx = cv.getContext('2d');
  cx.fillStyle = '#fff8f4';
  cx.beginPath();
  if (cx.roundRect) cx.roundRect(16, 16, 992, 268, 34); else cx.rect(16, 16, 992, 268);
  cx.fill();
  cx.strokeStyle = '#e8a7b2'; cx.lineWidth = 6; cx.setLineDash([16, 14]);
  cx.stroke();
  cx.setLineDash([]);
  cx.fillStyle = '#6a3fc5';
  /* texto na TELA leva acento (a regra de ASCII vale so para nome de funcao) */
  cx.font = '800 66px "Baloo 2", Arial';
  cx.textAlign = 'center'; cx.textBaseline = 'middle';
  cx.fillText('Deus cuida de você também.', 512, 148);
  var tex = new T.CanvasTexture(cv);
  tex.generateMipmaps = false; tex.minFilter = T.LinearFilter;
  var m = new T.Mesh(new T.PlaneGeometry(21, 6.2),
    new T.MeshBasicMaterial({map:tex, transparent:true, opacity:0, depthWrite:false, fog:false}));
  return m;
}
function revelacao(){
  REV.ativa = true;
  REV.t0 = relogio.getElapsedTime();
  esconderPrompt();
  if (!REV.maos){ REV.maos = construirMaos(); cena.add(REV.maos); }
  if (!REV.cartela){ REV.cartela = construirCartela(); cena.add(REV.cartela); }
  /* a camera esta longe: esconder o boneco e a guia economiza 7 draw calls
     no quadro mais pesado do jogo (medido: 36 -> 29) */
  boneco.visible = false; guia.visible = false; guiaGlow.visible = false;
  REV.maos.material.opacity = 0;
  REV.cartela.material.opacity = 0;
}
function tickRevelacao(t){
  if (!REV.ativa) return;
  var k = (t - REV.t0) / REV.dur;                    /* 0..1 */
  var e = Math.min(1, Math.max(0, k));
  var suave = e < 0.5 ? 2*e*e : 1 - Math.pow(-2*e + 2, 2)/2;
  /* camera sobe em orbita: raio 22 -> 58, altura 4 -> 30 */
  /* a camera precisa terminar ALTA (elevacao ~58 graus), senao ve so uma das
     maos; e mira o centro do mundo (0,-20), nao a praca */
  var ang = Math.PI * 0.25 + suave * Math.PI * 0.5;
  var raio = 24 + suave * 18, altura = 4 + suave * 58;
  cam.position.set(Math.sin(ang)*raio, altura, Math.cos(ang)*raio - 20);
  cam.lookAt(new T.Vector3(0, 0, -20));
  if (k > 0.42) REV.maos.material.opacity = Math.min(0.96, (k - 0.42) * 2.2);
  if (k > 0.72){
    REV.cartela.material.opacity = Math.min(1, (k - 0.72) * 3);
    REV.cartela.position.copy(cam.position);
    var dir = new T.Vector3(0, 0, -12).sub(cam.position).normalize();
    REV.cartela.position.addScaledVector(dir, 26);
    REV.cartela.lookAt(cam.position);
  }
  if (k >= 1 && !ESTADO.revelacao){
    ESTADO.revelacao = true;
    salvarEstado();
  }
}
function sairRevelacao(){
  if (!REV.ativa) return;
  REV.ativa = false;
  boneco.visible = true; guia.visible = true; guiaGlow.visible = true;
  if (REV.cartela) REV.cartela.material.opacity = 0;
  if (REV.maos) REV.maos.material.opacity = 0.55;   /* as maos ficam, discretas */
  ESTADO.revelacao = true;
  salvarEstado();
}

/* ===========================================================================
   MINHA CASA — na Vilinha cada crianca escolhe a sua casinha colorida.
   Guardada no estado (indice); a escolhida ganha bandeirinha dourada.
   =========================================================================== */
var CASA = { lista: [], perto: -1 };
function iniciarCasas(){
  var p = PECA['parteVilinha'];
  if (!p || !p.grupo || !p.grupo.userData.casas) return;
  CASA.lista = p.grupo.userData.casas;
  if (ESTADO.casa !== undefined && ESTADO.casa !== null && ESTADO.casa >= 0)
    api('marcarCasa')(ESTADO.casa);
}
function casaPerto(){
  if (!CASA.lista.length) return -1;
  var melhor = -1, dMin = 2.6;
  for (var i=0; i<CASA.lista.length; i++){
    var c = CASA.lista[i];
    var d = Math.hypot(PL.pos.x - c.px, PL.pos.z - c.pz);
    if (d < dMin){ dMin = d; melhor = i; }
  }
  return melhor;
}
function escolherCasa(i){
  if (i < 0) return;
  ESTADO.casa = i;
  api('marcarCasa')(i);
  salvarEstado();
  tocarPlim();
  mostrarPrompt('Esta casinha é sua! 🏡', 'entre para arrumar o quartinho');
  setTimeout(esconderPrompt, 3000);
}

/* ===========================================================================
   O QUARTINHO — a crianca ENTRA na casa dela e decora. O interior fica longe
   (400,400) numa caixa fechada; entrar/sair e teleporte com veu.
   =========================================================================== */
var QUARTO = { dentro:false, entrada:null, lim:null, voltaX:0, voltaZ:0 };
function iniciarQuarto(){

  api('corColcha')(ESTADO.colcha);
}
function entrarQuarto(){
  if (QUARTO.dentro || !QUARTO.entrada) return;

function sairQuarto(){

  PL.yaw = 0;

}
function naPortaDaMinhaCasa(){
  if (ESTADO.casa === undefined || ESTADO.casa === null || ESTADO.casa < 0) return false;
  if (!CASA.lista.length) return false;
  var c = CASA.lista[ESTADO.casa];
  return Math.hypot(PL.pos.x - c.px, PL.pos.z - c.pz) < 2.2;
}

/* --- visibilidade por regiao: a cidade vai crescer, entao so a regiao onde a
   crianca esta vai para a GPU (o quartinho sozinho custa ~7 draw calls) --- */
var FORA = ['parteCentro','parteLampioes','partePortaisMundo','parteCaminho',
            'parteCoreto','parteFlores','parteVilinha','parteTrem','partePistaKartAnel','parteKartAnelBordas','parteKartAnelObstaculos','parteParque','parteFesta',
            'parteIlha','parteEncanto','parteRadio','parteNuvemArcoIris','parteAgua',
            'parteMusical','parteJardimFe','parteCriancas','parteRodaPlataforma','parteRodaEstrela','parteRodaEstrutura','parteRodaLuzes','parteRodaCabines','parteRodaExterna','parteRodaFila','parteRodaLuzesGiro','parteRodaBancos','parteRodaCerca','parteArvoresMundo','parteLuminariasMundo','parteVasosMundo','parteMoitasMundo','parteCasteloMundo','parteCasasVilinha','parteBrinquedosParque','parteKartodromo'];
var JARDIM_P = ['parteCaminho','parteCoreto','parteFlores','parteJardimFe'];
var VILINHA_P = ['parteVilinha','parteAgua'];
/* o parque nao e mais uma peca so: quem esconde 'parteParque' de longe tem de
   esconder os brinquedos junto, senao eles ficam boiando sem o gramado */
var PARQUE_P = ['parteParque','parteBrinquedosParque'];
var zonaAtual = '';
function zonaDoJogador(){
  if (QUARTO.dentro) return 'quarto';
  if (NUVEM.emCima) return 'nuvem';
  if (PL.pos.x >  26) return 'parque';
  if (PL.pos.x < -26) return 'festa';
  if (PL.pos.z < -14) return 'jardim';
  if (PL.pos.z >  14) return 'vilinha';
  return 'praca';
}
function ver(lista, v){
  for (var i=0; i<lista.length; i++){
    var pp = PECA[lista[i]];
    if (pp && pp.grupo) pp.grupo.visible = v;
  }
}
/* onde cada peca mora e ate onde ela ainda vale a pena desenhar.
   ⛔ Estes raios foram calibrados para o mundo antigo, em que a crianca andava
   ate 53. Com o mundo maior (anda ate 75) as distancias cresceram ~40% e os
   raios velhos faziam zona SUMIR na cara de quem chegava. Cresceram junto. */
var LUGARES = {
  parteCentro:   {x:0,   z:0,   r:46},
  parteLampioes: {x:0,   z:0,   r:48},
  partePortaisMundo: {x:0, z:0, r:62},
  parteRadio:    {x:-42, z:0,   r:74},
  parteCaminho:  {x:0,   z:-34, r:84},
  parteCoreto:   {x:0,   z:-44, r:84},
  parteFlores:   {x:0,   z:-40, r:84},
  parteJardimFe: {x:-4,  z:-37, r:84},
  parteVilinha:  {x:0,   z:40,  r:86},
  parteAgua:     {x:0,   z:40,  r:78},
  parteParque:   {x:42,  z:0,   r:86},
  parteMusical:  {x:42,  z:0,   r:78},
  parteBrinquedosParque: {x:42, z:0, r:78},
  parteKartodromo: {x:38, z:30, r:80},
  parteRodaPlataforma: {x:43.5, z:0, r:52},
  parteRodaEstrela: {x:43.5, z:0, r:58},
  parteRodaEstrutura: {x:43.5, z:0, r:52},
  parteRodaLuzes: {x:43.5, z:0, r:52},
  parteRodaCabines: {x:43.5, z:0, r:52},
  parteRodaExterna: {x:33, z:0, r:44},
  parteRodaFila: {x:43.5, z:-2.5, r:44},
  parteRodaLuzesGiro: {x:43.5, z:0, r:52},
  parteRodaBancos: {x:43.5, z:0, r:52},
  parteRodaCerca: {x:43.5, z:-2.5, r:44},
  parteFesta:    {x:-40, z:25,  r:84},
  parteNuvemArcoIris: {x:-34, z:-34, r:84},
  parteCriancas: {x:0,   z:0,   r:200},
  parteEncanto:  {x:0,   z:0,   r:200},
  parteArvoresMundo: {x:0, z:0, r:200},
  parteLuminariasMundo: {x:0, z:0, r:200},
  parteVasosMundo: {x:0, z:0, r:200},
  parteMoitasMundo: {x:0, z:0, r:200},
  /* ⛔ estava r:46, mas o centro da praca esta a 48.1 e o spawn a 57.2:
     o MAIOR marco do mundo era invisivel justamente de onde deveria
     puxar a crianca. Marco de silhueta tem de ser visto de longe. */
  parteCasteloMundo: {x:34, z:-34, r:120},
  parteCasasVilinha: {x:0,  z:40,  r:46},   /* mesma zona da vilinha */
  parteIlha:     {x:0,   z:0,   r:400},
  parteTrem:     {x:0,   z:0,   r:400},
  partePistaKartAnel: {x:0, z:0, r:400},
  parteKartAnelBordas: {x:0, z:0, r:400},
  parteKartAnelObstaculos: {x:0, z:0, r:400}
};
function pertoDeMim(nome){
  var L = LUGARES[nome];
  if (!L) return true;
  return Math.hypot(PL.pos.x - L.x, PL.pos.z - L.z) <= L.r;
}
function visibilidadePorRegiao(forcar){
  var z = zonaDoJogador();
  if (!forcar && z === zonaAtual) return;
  zonaAtual = z;
  var dentro = (z === 'quarto');
  var q = PECA['parteQuartinho'];
  if (q && q.grupo) q.grupo.visible = dentro;
  ver(FORA, !dentro);
  if (estrelasInst) estrelasInst.visible = !dentro;
  if (!dentro){
    /* estao a ~80 m um do outro: quem esta numa ponta nao ve a outra */
    if (z === 'jardim') ver(VILINHA_P.concat(PARQUE_P), false);
    if (z === 'vilinha') ver(JARDIM_P.concat(PARQUE_P), false);
    if (z === 'parque') ver(JARDIM_P.concat(VILINHA_P, ['parteFesta']), false);
    if (z === 'festa') ver(JARDIM_P.concat(VILINHA_P, PARQUE_P), false);
    if (z === 'jardim' || z === 'vilinha') ver(['parteFesta'], false);
    /* no centro, o detalhe das pontas nao se le a 40 m: fica so a silhueta */
    if (z === 'praca') ver(['parteMusical','parteAgua','parteJardimFe','parteFlores'], false);
    /* nas pontas, o detalhe da praca tambem nao se le */
    if (z !== 'praca' && z !== 'quarto') ver(['parteRadio'], false);
    /* segundo filtro: o que estiver longe demais sai da GPU */
    for (var nome in LUGARES){
      var pp = PECA[nome];
      if (pp && pp.grupo && pp.grupo.visible && !pertoDeMim(nome)) pp.grupo.visible = false;
    }
  }
}

/* ===========================================================================
   RADIO DA SARINHA — o jukebox do mundo: a crianca escolhe uma das 3 musicas
   e ela toca enquanto ela brinca (nao e minigame, e trilha sonora).
   =========================================================================== */
var RADIO = { pronta:false, balcao:null, tocando:-1, audio:null };
var MUSICAS = [
  { nome:'Deus Cuida de Mim',      src:'b01.mp3' },
  { nome:'Viva, Viva Voc\u00EA',        src:'viva.mp3' },

];
function iniciarRadio(){

}
function noBalcaoDaRadio(){

}
function abrirRadio(){
